:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.preset{padding:13px;text-align:left}.thumb{display:grid;gap:4px;height:78px;background:var(--canvas);padding:5px;margin-bottom:9px;border:1px solid var(--line);border-radius:4px}.thumb i{border:1px solid var(--line);background:var(--paper);border-radius:2px}.thumb.split{grid-template-columns:1fr 1fr}.thumb.three{grid-template-columns:1fr 1fr 1fr}.thumb.grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.thumb.stack{grid-template-rows:1fr 1fr}.thumb i:last-child{background:#e7edf4;color:#4e6c98;text-align:center;font-size:11px;padding-top:10px;font-style:normal}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:0 22px;align-items:stretch}.canvas{display:grid;gap:12px;min-width:0;align-content:start}.canvas[data-layout=grid],.canvas[data-layout=split]{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas[data-layout=three]{grid-template-columns:repeat(3,minmax(0,1fr))}.canvas[data-layout=stack]{grid-template-columns:1fr}.pane{border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:0;min-height:255px;overflow:hidden;display:flex;flex-direction:column}.pane.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.pane-head{display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);padding:7px 9px;font-size:12px}.pane-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pane-head button{font-size:12px;padding:2px 7px;min-height:26px;border-color:transparent;background:transparent}.pane-body{padding:16px;flex:1;min-height:175px;display:flex;flex-direction:column;justify-content:center}.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.picker button{display:flex;flex-direction:column;gap:5px;padding:12px 8px;font-size:12px}.picker button b{font-size:20px;font-weight:400}.empty-hint{text-align:center;margin:0 0 13px;color:var(--muted);font-size:12px}.config{padding:14p <div class="shell"><aside class="sidebar"><strong>◈ DSH</strong><span class="muted">原生菜单保留位置</span><button disabled>＋ 新建会话</button><button disabled>技能中心</button><button disabled>插件</button><h3>工作区</h3><button disabled>▱ dsh-plugins</button><button disabled>历史会话</button><h3>工作台</h3><button class="on" onclick="reset()">▦ 创建应用</button><button disabled>　考公学习</button><button disabled>Agent</button><button disabled>Skills</button><a href="http://127.0.0.1:3082/" target="_blank" style="margin-top:auto">打开真实 DSH ↗</a><span class="muted">此原型不修改正式菜单</span></aside><main><header><h1 id="app-title">创建应用</h1><span class="badge">交互原型 · 内存演示</span><span class="spacer"></span><span id="save-status" class="muted"></span><div id="header-actions"></div></header><div id="body"></div><section class="state"><strong>当前交互状态</strong><dl id="state-summary"></dl><details><summary>查看完整状态</summary><pre id="state-json"></pre></details></section></main></div>
<div class="variant-bar"><button aria-label="上一方案" onclick="cycle(-1)">←</button><span id="variant-label"></span><button aria-label="下一方案" onclick="cycle(1)">→</button></div>
<script>
const kinds={website:['🌐','网站'],custom:['✨','自定义'],conversation:['💬','DSH 对话'],resources:['📁','资源管理'],animation:['🎬','动画'],display:['▥','数据展示']},layouts={split:['左右分栏',2],three:['三栏',3],grid:['四宫格',4],stack:['上下布局',2]},variantNames={A:'模块内配置 · 推荐',B:'画布＋设置侧栏',C:'模块聚焦配置'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variantNames[variant])variant='A';
let counter=0,state;
function newPage(label,layout='grid'){return{id:'page-'+(++counter),label,layout,modules:Array.from({length:layouts[layout][1]},()=>({id:'module-'+(++counter),type:'',title:'',config:{},phase:'empty'}))}}
function reset(){state={stage:'create',name:'学习助手',directory:'应用专属工作目录',layout:'grid',pages:[],activePage:'',selected:null,dirty:false,saved:null,preview:false,running:null,session:'未绑定',nativeView:'对话',notice:'选择布局后，直接在每个模块里选择内容。'};render()}
function page(){return state.pages.find(p=>p.id===state.activePage)}function module(){return page()?.modules.find(m=>m.id===state.selected)}
function dirty(){state.dirty=true;state.preview=false;renderState()}
function setVariant(v){variant=v;history.replaceState(null,'','?variant='+v);render()}
function cycle(n){const all=['A','B','C'];setVariant(all[(all.indexOf(variant)+n+3)%3])}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)})
function create(){state.stage='edit';const p=newPage('首页',state.layout);state.pages=[p];state.activePage=p.id;state.dirty=true;state.notice='点击空模块内的内容卡片配置；右侧为 DSH 原生会话预留区域。';render()}
function choose(id,type){state.selected=id;const m=module();m.type=type;m.title=kinds[type][1];m.config=type==='custom'?{mode:'generate'}:{};m.phase='configuring';dirty();render()}
function editField(key,value){module().config[key]=value;dirty()}
function titleField(value){module().title=value;dirty()}
function configure(id){state.selected=state.selected===id?null:id;render()}
function apply(){const m=module();if(m.phase!=='generated')m.phase='configured';state.selected=null;dirty();state.notice='配置已应用到原模块；当前仅为演示，未读取目录、连接网站或调用 DSH。';render()}
function generate(){const m=module();m.phase='generated';state.session='生成会话（演示绑定）';state.notice='演示：模块生成 Skill → DSH 原生会话执行 → 产物返回 '+m.title+'。没有真实模型调用。';dirty();render()}
function move(id,n){const p=page(),i=p.modules.findIndex(m=>m.id===id),j=i+n;if(j<0||j>=p.modules.length)return;[p.modules[i],p.modules[j]]=[p.modules[j],p.modules[i]];dirty();render()}
function remove(id){page().modules=page().modules.filter(m=>m.id!==id);if(state.selected===id)state.selected=null;dirty();render()}
function clearContent(id){const m=page().modules.find(m=>m.id===id);m.type='';m.title='';m.config={};m.phase='empty';state.selected=null;dirty();render()}
function addModule(){page().modules.push({id:'module-'+(++counter),type:'',title:'',config:{},phase:'empty'});dirty();render()}
function addPage(){const p=newPage('页面 '+(state.pages.length+1),'split');state.pages.push(p);state.activePage=p.id;state.selected=null;dirty();render()}
function selectPage(id){state.activePage=id;state.selected=null;render()}
function saveDraft(){state.saved=JSON.parse(JSON.stringify({name:state.name,directory:state.directory,pages:state.pages,session:state.session}));state.dirty=false;state.notice='演示草稿已保留在内存；刷新原型会清空。运行版本保持不变。';render()}
function preview(){if(!state.saved||state.dirty)return;state.preview=true;state.selected=null;state.notice='布局预览：所有内容均为占位示意；不会加载网站、资料或模型。';render()}
function activate(){if(!state.saved||state.dirty||!state.preview)return;state.running=JSON.parse(JSON.stringify(state.saved));state.notice='演示已启用保存的版本；后续编辑仅修改草稿。';render()}
function form(m){const field=(label,key,placeholder='')=>'<label>'+label+'<input aria-label="'+label+'" placeholder="'+placeholder+'" value="'+esc(m.config[key]||'')+'" oninput="editField(\''+key+'\',this.value)"></label>';let inner='';
 if(m.type==='website'||m.type==='animation')inner=field('内容地址','url','https://');
 if(m.type==='resources')inner=field('应用目录下的路径','path','materials/');
 if(m.type==='conversation')inner='<label>原生会话<select aria-label="原生会话" onchange="editField(\'session\',this.value)"><option>选择已有会话（示意）</option><option>新建 DSH 会话</option></select></label><p class="muted">正式接入完整原生视图：对话、轨迹、工具调用、审批。</p>';
 if(m.type==='custom')inner='<label>内容来源<select aria-label="内容来源" onchange="editField(\'mode\',this.value);render()">'+[['generate','描述需求生成'],['url','已有网站'],['file','已有 HTML']].map(([v,n])=>'<option value="'+v+'" '+(m.config.mode===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+(m.config.mode==='generate'?'<label>模块需求<textarea aria-label="模块需求" oninput="editField(\'requirement\',this.value)">'+esc(m.config.requirement||'')+'</textarea></label><label>复用 Agent<select aria-label="复用 Agent"><option>从 Agent 管理选择（示意）</option></select></label><p class="muted">工作台配套 Skill：模块生成 / 页面调整。应用自有能力保持不变。</p>':field(m.config.mode==='url'?'网页地址':'HTML 相对路径',m.config.mode==='url'?'url':'path'));
 if(m.type==='display')inner='<label>展示类型<select aria-label="展示类型" onchange="editField(\'display\',this.value)">'+['统计卡片','列表','图表','地图','详情','筛选'].map(v=>'<option '+(m.config.display===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>数据源<select aria-label="数据源" onchange="editField(\'data\',this.value)"><option>选择已注册数据源</option><option>阅读记录（演示数据源）</option></select></label><p class="muted">数据展示 Skill 只使用声明的数据连接。</p>';
 return '<div class="config"><h3>'+esc(m.title)+' · 设置</h3><label>模块名称<input aria-label="模块名称" value="'+esc(m.title)+'" oninput="titleField(this.value)"></label>'+inner+'<div class="actions">'+(m.type==='custom'&&m.config.mode==='generate'?'<button class="primary" onclick="generate()">生成演示</button>':'')+'<button class="primary" onclick="apply()">完成配置</button><button onclick="state.selected=null;render()">收起</button></div></div>'}
function content(m){if(!m.type)return '<p class="empty-hint">为这个模块选择内容</p><div class="picker">'+Object.entries(kinds).map(([k,[icon,name]])=>'<button aria-label="选择'+name+': '+m.id+'" onclick="choose(\''+m.id+'\',\''+k+'\')"><b>'+icon+'</b>'+name+'</button>').join('')+'</div>';
 const info=m.config.url||m.config.path||m.config.requirement||m.config.data||'点击设置，完成这个模块的配置';return '<div class="content-view"><span class="content-icon">'+kinds[m.type][0]+'</span><strong>'+esc(m.title)+'</strong><span class="content-meta">'+esc(info)+'</span>'+(m.phase==='generated'?'<div class="stats-demo"><span>生成页面占位</span><span>可继续修改</span></div>':'')+'<span class="badge">'+(m.phase==='generated'?'演示产物':m.phase==='configured'?'已配置 · 演示':'待配置')+'</span></div>'}
function pane(m,i){return '<section class="pane '+(state.selected===m.id?'selected':'')+'" data-module="'+m.id+'"><div class="pane-head"><strong>'+esc(m.title||'模块 '+(i+1))+'</strong><span class="spacer"></span><button aria-label="前移模块: '+m.id+'" onclick="move(\''+m.id+'\',-1)">←</button><button aria-label="后移模块: '+m.id+'" onclick="move(\''+m.id+'\',1)">→</button>'+ (m.type?'<button aria-label="更换内容: '+m.id+'" onclick="clearContent(\''+m.id+'\')">更换</button><button aria-label="配置模块: '+m.id+'" onclick="configure(\''+m.id+'\')">设置</button>':'')+'<button aria-label="移除模块: '+m.id+'" onclick="remove(\''+m.id+'\')">×</button></div><div class="pane-body">'+content(m)+'</div>'+(variant==='A'&&state.selected===m.id&&m.type&&!state.preview?form(m):'')+'</section>'}
function nativePane(){return '<section class="native-pane"><div class="native-head"><strong>DSH 原生会话区域</strong><span class="badge" style="float:right">原型占位</span></div><div class="native-bind"><label>应用关联会话<select aria-label="应用关联会话" onchange="state.session=this.value;dirty();render()">'+['未绑定','选择已有会话（演示）','新建会话（演示）','生成会话（演示绑定）'].map(v=>'<option '+(state.session===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label></div><div class="native-tabs">'+['对话','轨迹'].map(v=>'<button class="'+(state.nativeView===v?'on':'')+'" onclick="state.nativeView=\''+v+'\';render()">'+v+'</button>').join('')+'</div><div class="native-body"><strong>这里将挂载 DSH 原生'+state.nativeView+'视图</strong><p>完整保留原生工具调用、审批与会话能力。</p><p class="muted">当前为布局占位，未连接真实会话。<br>不以模拟轨迹证明原生接入成功。</p><a href="http://127.0.0.1:3082/" target="_blank">打开真实 DSH 查看原生视图 ↗</a></div><div class="native-composer"><textarea disabled placeholder="正式实现使用 DSH 原生输入框"></textarea></div></section>'}
function renderState(){ if($('preview-button'))$('preview-button').disabled=!state.saved||state.dirty;if($('activate-button'))$('activate-button').disabled=!state.saved||state.dirty||!state.preview;$('save-status').textContent=state.stage==='create'?'':state.dirty?'草稿未保存':'草稿已保存（内存）';$('state-summary').innerHTML=[['方案',variant+' · '+variantNames[variant]],['当前阶段',state.stage==='create'?'选择布局':state.preview?'预览':'编辑模块'],['选中模块',state.selected||'无'],['草稿状态',state.dirty?'未保存':state.saved?'已保存（内存）':'尚未创建'],['运行版本',state.running?'存在演示版本':'未启用'],['会话绑定',state.session]].map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>').join('');$('state-json').textContent=JSON.stringify(state,null,2)}
function render(){ $('variant-label').textContent=variant+' · '+variantNames[variant];$('app-title').textContent=state.stage==='create'?'创建应用':state.name;$('header-actions').innerHTML=state.stage==='create'?'':'<button onclick="state.preview=false;render()" '+(!state.preview?'class="on"':'')+'>编辑</button> <button id="preview-button" onclick="preview()" '+(!state.saved||state.dirty?'disabled':'')+'>预览</button> <button onclick="saveDraft()">保存草稿</button> <button id="activate-button" class="primary" onclick="activate()" '+(!state.saved||state.dirty||!state.preview?'disabled':'')+'>启用</button>';
 if(state.stage==='create')$('body').innerHTML='<section class="intro"><h2>先选布局，再在模块中填入内容</h2><p class="muted">参考 Worktable：每个空窗格都是内容选择器。正式页面可包含完整 DSH 原生会话区域。</p><div class="basic"><label>应用名称<input aria-label="应用名称" value="'+esc(state.name)+'" oninput="state.name=this.value;renderState()"></label><label>工作目录<input aria-label="工作目录" value="'+esc(state.directory)+'" oninput="state.directory=this.value;renderState()"></label></div><div class="presets">'+Object.entries(layouts).map(([key,[name,count]])=>'<button class="preset '+(state.layout===key?'on':'')+'" aria-label="布局：'+name+'" onclick="state.layout=\''+key+'\';render()"><span class="thumb '+key+'">'+Array.from({length:count+1},(_,i)=>'<i>'+(i===count?'💬':'')+'</i>').join('')+'</span>'+name+'</button>').join('')+'</div><button class="primary" onclick="create()">创建并进入画布</button><p class="muted">不连接目录、不调用模型、不保存正式数据。所有操作只存在于原型内存。</p></section>';
 else {const p=page();$('body').innerHTML='<div class="toolbar">'+state.pages.map(v=>'<button class="'+(v.id===p.id?'on':'')+'" onclick="selectPage(\''+v.id+'\')">'+esc(v.label)+'</button>').join('')+'<button onclick="addPage()">＋ 页面</button><span class="spacer"></span><span class="muted">'+layouts[p.layout][0]+' · '+p.modules.length+' 个模块</span><button onclick="state.selected=null;state.notice=\'示意：分隔线调尺寸将在正式实现中接入并持久化。\';render()">布局设置</button></div><p class="notice">'+esc(state.notice)+'</p><div class="workspace '+(state.preview?'preview':'')+'"><div class="canvas" data-layout="'+p.layout+'">'+p.modules.map(pane).join('')+'<button class="add" onclick="addModule()">＋ 添加模块</button></div>'+nativePane()+'</div><details class="settings"><summary>应用设置与公共能力边界</summary><p>复杂配方放在高级设置；公共 Agent、Skills 仅来自现有管理入口，各应用私有能力暂不迁移。</p><p>生成能力由工作台配套 Skills 提供：应用搭建、模块生成、数据展示、页面调整。</p></details>';
 const m=module();if(m&&m.type&&!state.preview&&variant==='B')$('body').insertAdjacentHTML('beforeend','<aside class="inspector"><div class="pane-head"><strong>模块配置 · '+esc(m.title)+'</strong><span class="spacer"></span><button onclick="state.selected=null;render()">关闭</button></div>'+form(m)+'</aside>');if(m&&m.type&&!state.preview&&variant==='C')$('body').insertAdjacentHTML('beforeend','<section class="focus"><div class="pane-head"><strong>聚焦模块 · '+esc(m.title)+'</strong><span class="spacer"></span><button onclick="state.selected=null;render()">返回画布</button></div>'+form(m)+'<div class="focus-preview">'+content(m)+'</div></section>');}
 renderState()}
reset();
</script></html>
