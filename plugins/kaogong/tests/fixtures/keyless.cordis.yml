# Keyless kaogong smoke：真实 Loader 树 + 存储栈 + kaogong 插件 + mock LLM。
- id: kaogong-mock-llm
  name: './kaogong-mock-llm.ts'

- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: './.kaogong-storage'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: 'json'

- id: kaogong
  name: '../../src/index.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../examples/headless-agent/cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: kaogong-mock
              model: kaogong-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless kaogong smoke.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
