<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 · 配置管理 / SSH 连接（3 种管理方式）</title>
<link rel="stylesheet" href="/api/worktable/template/dshell.css" />
<style>
  /* ============ 原型说明 ============
     问题：bug-solver「窗口2」是配置管理页，先做 SSH 连接的管理——
     多条连接怎么列出、怎么新建/编辑/删除/测试、怎么指定默认连接？
     三种结构不同的管理方式，底部切换条 / ← → 键切换（?variant=A|B|C）。
     A 主从（列表+右侧表单）· B 数据表 + 抽屉 · C 卡片网格 + 全屏编辑。
     代码项目与 git 分支放到下一块（页签已占位）。演示数据，不发起真实 SSH。
  */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }
  #root { height: 100%; }
  button, input, select, textarea { font-family: inherit; }
  a { color: var(--dsw-alias-state-accent-primary, #4f8ef7); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .protoPill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; border: 1px dashed rgba(210,153,34,.55); color: #d29922; font-size: 10.5px; letter-spacing: .3px; white-space: nowrap; }
  .protoPill.blue { border-color: rgba(79,142,247,.55); color: #4f8ef7; }
  .smBtn { font-size: 12px; padding: 5px 12px; }
  .dshell-badge { white-space: nowrap; }
  .badgeErr { color: #f85149 !important; border-color: rgba(248,81,73,.45) !important; }
  .badgeErr::before { background: #f85149 !important; box-shadow: 0 0 5px #f85149 !important; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; flex: none; }
  .dot.ok { background: #3fb950; box-shadow: 0 0 5px #3fb950; }
  .dot.fail { background: #f85149; }
  .dot.unknown { background: #6b7280; }

  /* 表单件 */
  .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fldLabel { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--dsw-alias-label-secondary, #9aa4b2); font-size: 11.5px; }
  .fldErr { color: #f85149; font-size: 10.5px; white-space: nowrap; }
  .fldHint { color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dshell-input.bad { border-color: rgba(248,81,73,.7); }
  .inputRow { display: flex; gap: 8px; align-items: center; }
  .inputRow .dshell-input { flex: 1; min-width: 0; }
  .inputRow > button { flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chipsLabel { color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 11px; margin-right: 2px; }
  .chip { border: 1px solid var(--dsw-alias-border-l1, #262b36); background: transparent; color: var(--dsw-alias-label-secondary, #9aa4b2); font-size: 11.5px; padding: 3px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--dsw-alias-label-primary, #e6e8eb); border-color: var(--dsw-alias-border-l2, #3a4150); }
  .chip.on { color: var(--dsw-alias-label-primary, #e6e8eb); border-color: var(--dsw-alias-state-accent-primary, #4f8ef7); background: color-mix(in srgb, var(--dsw-alias-state-accent-primary, #4f8ef7) 14%, transparent); }
  .chip .cnt { color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 10px; margin-left: 3px; }
  .miniBtn { font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--dsw-alias-border-l1, #262b36); background: transparent; color: var(--dsw-alias-label-secondary, #9aa4b2); cursor: pointer; white-space: nowrap; }
  .miniBtn:hover { color: var(--dsw-alias-label-primary, #e6e8eb); border-color: var(--dsw-alias-border-l2, #3a4150); }
  .miniBtn.danger { color: #f85149; border-color: rgba(248,81,73,.4); }
  .miniBtn.primary { color: #3fb950; border-color: rgba(63,185,80,.4); }
  .keyStatus { font-size: 11.5px; color: var(--dsw-alias-label-secondary, #9aa4b2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cmdLine { margin: 0; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--dsw-alias-border-l1, #262b36); background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--dsw-alias-label-secondary, #9aa4b2); overflow-x: auto; white-space: nowrap; }

  /* 连接检查面板（三方案共用状态展示） */
  .tstHead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .tstTitle { font-size: 12px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .tstHint { color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 10.5px; margin-left: auto; }
  .tstRow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; padding: 2px 0; color: var(--dsw-alias-label-secondary, #9aa4b2); }
  .tstRow .tstIcon { width: 14px; text-align: center; flex: none; }
  .tstRow.done { color: var(--dsw-alias-label-primary, #e6e8eb); }
  .tstRow.done .tstIcon { color: #3fb950; }
  .tstRow.run .tstIcon { color: #d29922; }
  .tstRow.fail { color: #f85149; }
  .tstRow.fail .tstIcon { color: #f85149; }
  .tstRow .tstMs { margin-left: auto; color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 10.5px; }
  .tstFail { margin-top: 6px; padding: 6px 9px; border-radius: 7px; border: 1px solid rgba(248,81,73,.4); background: rgba(248,81,73,.08); color: #f85149; font-size: 11.5px; line-height: 1.5; }

  /* ============ 页面外壳：配置管理 ============ */
  .cfg { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .cfg-top { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 11px 16px 8px; }
  .cfg-tabs { flex: none; display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); overflow-x: auto; }
  .cfg-tab { padding: 7px 11px; font: inherit; font-size: 12px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--dsw-alias-label-secondary, #9aa4b2); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .cfg-tab:hover { color: var(--dsw-alias-label-primary, #e6e8eb); }
  .cfg-tab.on { color: var(--dsw-alias-label-primary, #e6e8eb); border-bottom-color: var(--dsw-alias-state-accent-primary, #4f8ef7); }
  .cfg-count { font-size: 10px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--dsw-alias-border-l1, #262b36); color: var(--dsw-alias-label-tertiary, #6b7280); }
  .cfg-soon { font-size: 9.5px; padding: 0 6px; border-radius: 999px; border: 1px dashed rgba(210,153,34,.5); color: #d29922; }
  .cfg-body { flex: 1; min-height: 0; }

  /* 编辑器（三种外壳里复用同一批字段，布局各自不同） */
  .edHead { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 11px 16px 9px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .edHead h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .edHead .sub { color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 10.5px; margin-top: 2px; }
  .edBody { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 13px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .edFoot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 9px 16px; border-top: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .edFoot .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .edGrid { display: grid; grid-template-columns: 1.1fr 88px 1fr; gap: 10px; }
  .edGrid .spanAll { grid-column: 1 / -1; }
  .edGridC { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edGridC .spanAll { grid-column: 1 / -1; }
  .edSection { display: flex; flex-direction: column; gap: 8px; }
  .edSectionTitle { font-size: 11px; font-weight: 600; color: var(--dsw-alias-label-secondary, #9aa4b2); letter-spacing: .3px; }
  .edToggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dsw-alias-label-primary, #e6e8eb); cursor: pointer; }
  .edToggle input { accent-color: #3fb950; width: 14px; height: 14px; }
  .delConfirm { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #f85149; flex-wrap: wrap; }

  /* ============ A · 主从（列表 + 右侧表单） ============ */
  .ma { display: grid; grid-template-columns: 272px 1fr; height: 100%; min-width: 0; }
  .ma-side { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .ma-sideHead { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); font-size: 12px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .ma-filters { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); display: flex; gap: 5px; flex-wrap: wrap; }
  .ma-list { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ma-item { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--dsw-alias-border-l1, #262b36); background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); color: var(--dsw-alias-label-secondary, #9aa4b2); cursor: pointer; font: inherit; }
  .ma-item:hover { border-color: var(--dsw-alias-border-l2, #3a4150); }
  .ma-item.on { border-color: var(--dsw-alias-state-accent-primary, #4f8ef7); background: color-mix(in srgb, var(--dsw-alias-state-accent-primary, #4f8ef7) 10%, transparent); }
  .ma-itemTop { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .ma-itemName { font-size: 12.5px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ma-itemTag { margin-left: auto; flex: none; font-size: 9.5px; padding: 0 6px; border-radius: 999px; border: 1px solid rgba(63,185,80,.4); color: #3fb950; }
  .ma-itemAddr { font-size: 11px; font-family: ui-monospace, Consolas, monospace; color: var(--dsw-alias-label-secondary, #9aa4b2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ma-itemMeta { font-size: 10px; color: var(--dsw-alias-label-tertiary, #6b7280); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ma-editor { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  /* ============ B · 数据表 + 抽屉 ============ */
  .mb { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .mb-toolbar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 16px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .mb-toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .mb-wrap { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 0 16px 12px; }
  .mb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .mb-table thead th { position: sticky; top: 0; z-index: 1; text-align: left; padding: 9px 10px; color: var(--dsw-alias-label-secondary, #9aa4b2); font-size: 10.5px; font-weight: 500; background: var(--dsw-alias-bg-base, #0b0e14); border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); white-space: nowrap; }
  .mb-table tbody tr { cursor: pointer; }
  .mb-table tbody tr:hover { background: var(--dsw-alias-fill-l1, rgba(255,255,255,.04)); }
  .mb-table tbody tr.on { background: color-mix(in srgb, var(--dsw-alias-state-accent-primary, #4f8ef7) 10%, transparent); }
  .mb-table td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; }
  .mb-table td.name { font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); white-space: nowrap; }
  .mb-table td.addr { font-family: ui-monospace, Consolas, monospace; color: var(--dsw-alias-label-primary, #e6e8eb); white-space: nowrap; }
  .mb-table td.key { color: var(--dsw-alias-label-tertiary, #6b7280); font-family: ui-monospace, Consolas, monospace; font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mb-actions { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
  .mb-test { flex: none; border-top: 1px solid var(--dsw-alias-border-l1, #262b36); padding: 9px 16px; background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); }
  .mb-drawerMask { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .16s ease; z-index: 5; }
  .mb-drawerMask.on { opacity: 1; pointer-events: auto; }
  .mb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(450px, 94vw); display: flex; flex-direction: column; background: var(--dsw-alias-bg-base, #0b0e14); border-left: 1px solid var(--dsw-alias-border-l2, #3a4150); box-shadow: -24px 0 60px rgba(0,0,0,.45); transform: translateX(102%); transition: transform .2s ease; z-index: 6; }
  .mb-drawer.on { transform: none; }
  .mb-drawerHead { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); color: var(--dsw-alias-label-secondary, #9aa4b2); font-size: 11.5px; }
  .mb-drawerHead .x { margin-left: auto; }

  /* ============ C · 卡片网格 + 全屏编辑 ============ */
  .mc { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .mc-toolbar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 16px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .mc-toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .mc-grid { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 12px 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; align-content: start; }
  .mc-card { display: flex; flex-direction: column; gap: 6px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--dsw-alias-border-l1, #262b36); background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); cursor: pointer; }
  .mc-card:hover { border-color: var(--dsw-alias-border-l2, #3a4150); }
  .mc-card.on { border-color: var(--dsw-alias-state-accent-primary, #4f8ef7); background: color-mix(in srgb, var(--dsw-alias-state-accent-primary, #4f8ef7) 8%, transparent); }
  .mc-cardHead { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .mc-name { font-size: 12.5px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc-addr { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--dsw-alias-label-primary, #e6e8eb); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc-kv { display: flex; flex-direction: column; gap: 1px; font-size: 10.5px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .mc-kv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc-cardFoot { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; padding-top: 7px; border-top: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .mc-editor { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .mc-test { flex: none; border-top: 1px solid var(--dsw-alias-border-l1, #262b36); padding: 9px 16px; background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); }

  /* 空状态 */
  .emptyState { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 34px 20px; color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 12.5px; text-align: center; }
  .emptyState .big { font-size: 24px; opacity: .6; }

  /* ============ 原型切换条 / toast（不属于设计本身） ============ */
  .switcher { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 999px; background: #1b2230; border: 1px solid rgba(255,255,255,.22); box-shadow: 0 10px 30px rgba(0,0,0,.55); z-index: 50; color: #e6e8eb; }
  .switcher button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: transparent; color: #e6e8eb; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .switcher button:hover { background: rgba(255,255,255,.1); }
  .switcher .label { font-size: 11.5px; padding: 0 2px; white-space: nowrap; }
  .switcher .label b { font-weight: 700; }
  .switcher .state { color: #8b949e; font-size: 10.5px; border-left: 1px solid rgba(255,255,255,.16); padding-left: 9px; white-space: nowrap; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }
  .switcher .keys { color: #6b7280; font-size: 10px; border-left: 1px solid rgba(255,255,255,.16); padding-left: 9px; white-space: nowrap; }
  .toast { position: fixed; right: 14px; bottom: 58px; max-width: min(420px, 88vw); background: #1b2230; border: 1px solid rgba(255,255,255,.22); border-radius: 10px; padding: 8px 12px; font-size: 11.5px; line-height: 1.5; color: #e6e8eb; box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; transform: translateY(6px); transition: .18s ease; z-index: 60; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    .cfg { padding-bottom: 44px; }
    .ma { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .ma-side { border-right: none; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); max-height: 34vh; }
    .ma-filters { padding: 6px 10px; }
    .ma-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .ma-item { min-width: 210px; }
    .edGrid, .edGridC { grid-template-columns: 1fr; }
    .edGrid > .fld:nth-child(3) { max-width: 120px; }
    /* 窄屏：表格转成竖排条目，避免横向滚动 */
    .mb-table { display: block; }
    .mb-table thead { display: none; }
    .mb-table tbody { display: flex; flex-direction: column; gap: 8px; }
    .mb-table tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 11px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 9px; }
    .mb-table td { display: block; padding: 0; border: none; }
    .mb-table td.name { grid-column: 1; grid-row: 1; white-space: normal; }
    .mb-table td:nth-child(5) { grid-column: 2; grid-row: 1; justify-self: end; }
    .mb-table td.addr { grid-column: 1; grid-row: 2; }
    .mb-table td:nth-child(3) { grid-column: 1; grid-row: 3; color: var(--dsw-alias-label-tertiary, #6b7280); }
    .mb-table td:nth-child(4), .mb-table td:nth-child(6) { display: none; }
    .mb-table td:nth-child(7) { grid-column: 1 / -1; grid-row: 4; justify-self: end; }
  }
</style>
</head>
<body>
<div id="root"></div>

<div class="switcher" role="group" aria-label="原型方案切换">
  <button id="prevBtn" type="button" aria-label="上一个方案">‹</button>
  <span class="label" id="swLabel">A · 主从（列表 + 右侧表单）</span>
  <span class="state" id="swState">3 条连接 · 默认 生产服务器</span>
  <span class="keys">← → 切换</span>
  <button id="nextBtn" type="button" aria-label="下一个方案">›</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ================= 演示数据（原型：不连真实服务器） ================= */
  var VARIANTS = [
    { key: 'A', name: '主从（列表 + 右侧表单）', note: '选中即改，右侧表单一直开着' },
    { key: 'B', name: '数据表 + 抽屉', note: '表格总览，点行开抽屉编辑' },
    { key: 'C', name: '卡片网格 + 全屏编辑', note: '每条连接一张卡，点开整页编辑' }
  ];

  var DEFAULT_NEW = { id: null, name: '', host: '', port: '22', user: '', key: '~/.ssh/id_ed25519', isDefault: false };

  var KEY_CHIPS = ['~/.ssh/id_ed25519', '~/.ssh/id_rsa', 'C:\\Users\\Administrator\\.ssh\\id_ed25519'];

  var SEED = [
    { id: 'c1', name: '生产服务器', host: '10.20.31.87', port: '22', user: 'deploy', key: '~/.ssh/id_ed25519', isDefault: true, status: 'ok', lastTest: '2 小时前' },
    { id: 'c2', name: '测试服务器', host: '10.20.31.102', port: '2222', user: 'root', key: '~/.ssh/id_rsa', isDefault: false, status: 'unknown', lastTest: '未测试' },
    { id: 'c3', name: '内网构建机', host: '192.168.1.50', port: '22', user: 'ci', key: '~/.ssh/id_rsa', isDefault: false, status: 'fail', lastTest: '3 天前' }
  ];

  var TEST_STEPS = ['解析主机地址', '建立 TCP 连接', '密钥认证', '读取远端信息'];

  var S = {
    variant: 'A',
    connections: SEED.map(function (c) { return Object.assign({}, c); }),
    selectedId: 'c1',
    editingId: 'c1',
    editorOpen: true,
    draft: Object.assign({}, SEED[0]),
    errors: {},
    keyCheck: { status: 'idle' },
    test: { status: 'idle', steps: [], message: '', forId: null },
    filter: 'all',
    confirmDelete: null,
    savedAt: null,
    dirty: false
  };

  /* ================= 小工具 ================= */
  var root = document.getElementById('root');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var swLabel = document.getElementById('swLabel');
  var swState = document.getElementById('swState');

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 3400);
  }
  function copyConn(c) {
    return { id: c.id || null, name: c.name || '', host: c.host || '', port: c.port == null ? '' : String(c.port), user: c.user || '', key: c.key || '', isDefault: !!c.isDefault };
  }
  function connById(id) {
    for (var i = 0; i < S.connections.length; i++) if (S.connections[i].id === id) return S.connections[i];
    return null;
  }
  function clockText(d) {
    if (!d) return '';
    function p(n) { return n < 10 ? '0' + n : String(n); }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function savedText() {
    return S.savedAt ? '上次保存 ' + clockText(S.savedAt) + '（原型不落盘）' : '尚未保存';
  }
  function sshCmd(v) {
    return 'ssh -i ' + (v.key || '<私钥>') + ' -p ' + (v.port || '22') + ' ' + (v.user || '<用户>') + '@' + (v.host || '<主机>');
  }
  function refreshLive() {
    root.querySelectorAll('[data-live]').forEach(function (node) {
      if (node.getAttribute('data-live') === 'cmd') node.textContent = S.draft ? sshCmd(S.draft) : '';
    });
  }
  function statusBadge(status, small) {
    var cls = status === 'ok' ? 'dshell-badge dshell-badgeDone' : status === 'fail' ? 'dshell-badge badgeErr' : 'dshell-badge';
    var text = status === 'ok' ? '已连接' : status === 'fail' ? '异常' : '未测试';
    return '<span class="' + cls + '"' + (small ? ' style="font-size:10.5px;padding:1px 8px"' : '') + '>' + text + '</span>';
  }
  function cardMetaText(c) {
    var s = c.status === 'ok' ? '已连接' : c.status === 'fail' ? '连接异常' : '未测试';
    return (!c.lastTest || c.lastTest === '未测试') ? s : s + ' · 最近测试 ' + c.lastTest;
  }
  function countOf(kind) {
    if (kind === 'all') return S.connections.length;
    return S.connections.filter(function (c) { return c.status === kind; }).length;
  }
  function filteredConnections() {
    if (S.filter === 'all') return S.connections;
    return S.connections.filter(function (c) { return c.status === S.filter; });
  }
  function filtersHtml(extraClass) {
    var defs = [['all', '全部'], ['ok', '已连接'], ['fail', '异常'], ['unknown', '未测试']];
    return '<div class="chips ' + (extraClass || '') + '">' + defs.map(function (d) {
      return '<button type="button" class="chip' + (S.filter === d[0] ? ' on' : '') + '" data-action="filter" data-value="' + d[0] + '">' + d[1] + '<span class="cnt">' + countOf(d[0]) + '</span></button>';
    }).join('') + '</div>';
  }

  /* ================= 校验 ================= */
  var HOST_RE = /^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$/;
  var USER_RE = /^[A-Za-z_][A-Za-z0-9_-]{0,31}$/;
  var KEY_OK_RE = /(id_rsa|id_ed25519|id_ecdsa|id_dsa|\.pem|\.ppk)$/i;

  function validateDraft() {
    var d = S.draft || {};
    var e = {};
    if (!String(d.name || '').trim()) e.name = '必填';
    var host = String(d.host || '').trim();
    if (!host) e.host = '必填';
    else if (!HOST_RE.test(host)) e.host = '只能是 IP 或域名';
    var port = Number(d.port);
    if (!String(d.port || '').trim()) e.port = '必填';
    else if (!isFinite(port) || Math.floor(port) !== port || port < 1 || port > 65535) e.port = '1–65535';
    if (!USER_RE.test(String(d.user || '').trim())) e.user = '格式不正确';
    if (!String(d.key || '').trim()) e.key = '必填';
    S.errors = e;
    return Object.keys(e).length === 0;
  }
  function refreshErrs() {
    root.querySelectorAll('[data-err]').forEach(function (node) {
      node.textContent = S.errors[node.getAttribute('data-err')] || '';
    });
    root.querySelectorAll('[data-field]').forEach(function (node) {
      node.classList.toggle('bad', !!S.errors[node.getAttribute('data-field')]);
    });
  }
  function focusFirstBad() {
    var order = ['name', 'host', 'port', 'user', 'key'];
    for (var i = 0; i < order.length; i++) {
      if (!S.errors[order[i]]) continue;
      var node = root.querySelector('[data-field="' + order[i] + '"]');
      if (node) {
        try { node.focus(); } catch (e) { /* ignore */ }
        try { node.scrollIntoView({ block: 'center' }); } catch (e2) { /* ignore */ }
        return;
      }
    }
  }

  /* ================= 密钥检测 / 连接测试 ================= */
  function keyStatusHtml() {
    var k = S.keyCheck || { status: 'idle' };
    if (k.status === 'idle') return '<span class="dshell-muted">指向本机私钥文件，保存后通过 ssh -i 使用</span>';
    if (k.status === 'checking') return '<span class="dshell-badge dshell-badgeWait">检测中…</span>';
    if (k.status === 'ok') return '<span class="dshell-badge dshell-badgeDone">密钥可用</span><span class="dshell-muted">' + esc(k.msg || '') + '</span>';
    return '<span class="dshell-badge badgeErr">密钥不可用</span><span class="dshell-muted">' + esc(k.msg || '') + '</span>';
  }
  function refreshKeyUI() {
    root.querySelectorAll('[data-key-status]').forEach(function (node) { node.innerHTML = keyStatusHtml(); });
  }
  async function checkKey() {
    var k = String((S.draft && S.draft.key) || '').trim();
    if (!k) { S.keyCheck = { status: 'idle' }; refreshKeyUI(); return; }
    S.keyCheck = { status: 'checking' };
    refreshKeyUI();
    await sleep(560);
    if (!KEY_OK_RE.test(k)) S.keyCheck = { status: 'fail', msg: '未找到该文件，或不是受支持的密钥格式' };
    else if (/^~\/\.ssh\//.test(k) || /^[A-Za-z]:\\/.test(k)) S.keyCheck = { status: 'ok', msg: '文件存在 · ed25519 · 权限 600' };
    else S.keyCheck = { status: 'ok', msg: '文件存在 · 权限 600' };
    refreshKeyUI();
  }
  function testBoxHtml() {
    var t = S.test;
    if (t.status === 'idle') return '';
    var name = '';
    if (t.forId) {
      var c = connById(t.forId);
      if (c) name = c.name;
    }
    var rows = t.steps.map(function (s) {
      var icon = s.state === 'done' ? '✓' : s.state === 'fail' ? '✕' : s.state === 'run' ? '…' : '·';
      return '<div class="tstRow ' + esc(s.state) + '"><span class="tstIcon">' + icon + '</span><span>' + esc(s.label) + '</span><span class="tstMs">' + esc(s.detail || '') + '</span></div>';
    }).join('');
    var head = '<div class="tstHead"><span class="tstTitle">连接检查' + (name ? ' · ' + esc(name) : '') + '</span>' +
      (t.status === 'ok' ? '<span class="dshell-badge dshell-badgeDone">连接成功</span>' : t.status === 'fail' ? '<span class="dshell-badge badgeErr">连接失败</span>' : '<span class="dshell-badge dshell-badgeWait">连接中…</span>') +
      '<span class="tstHint">原型模拟，不发起真实 SSH</span></div>';
    var fail = t.status === 'fail' && t.message ? '<div class="tstFail">' + esc(t.message) + '</div>' : '';
    return head + rows + fail;
  }
  function refreshTestUI() {
    root.querySelectorAll('.testSlot').forEach(function (box) { box.innerHTML = testBoxHtml(); });
    root.querySelectorAll('[data-action="test-draft"], [data-action="quick-test"]').forEach(function (node) {
      var running = S.test.status === 'running';
      node.disabled = running;
      node.textContent = running ? '测试中…' : (node.getAttribute('data-test-label') || '测试连接');
    });
    refreshLive();
  }
  function failReason(v, forceFail) {
    if (forceFail) return { index: 2, message: 'Permission denied (publickey)：服务器拒绝了该密钥（原型演示的失败态）。' };
    var host = String(v.host || '').trim();
    if (host === '0.0.0.0' || /\.bad$/i.test(host)) return { index: 0, message: '无法解析主机地址 ' + host + '（原型演示的失败态）。' };
    if (String(v.port) !== '22') return { index: 1, message: 'TCP 连接失败：' + host + ':' + v.port + ' 拒绝连接（原型演示的失败态；改回 22 端口可成功）。' };
    if (!KEY_OK_RE.test(String(v.key || '').trim())) return { index: 2, message: '密钥文件不存在或不可读：' + v.key + '（原型演示的失败态）。' };
    return null;
  }
  async function startTest(v, forId, forceFail) {
    if (S.test.status === 'running') return;
    S.test = { status: 'running', steps: TEST_STEPS.map(function (l) { return { label: l, state: 'wait', detail: '' }; }), message: '', forId: forId || null };
    mount();
    var slot = document.querySelector('.testSlot');
    if (slot) { try { slot.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ } }
    var fail = failReason(v, forceFail);
    for (var i = 0; i < TEST_STEPS.length; i++) {
      var step = S.test.steps[i];
      step.state = 'run';
      refreshTestUI();
      await sleep(300 + Math.random() * 260);
      if (fail && fail.index === i) {
        step.state = 'fail';
        S.test.status = 'fail';
        S.test.message = fail.message;
        applyStatus(forId, 'fail');
        refreshTestUI();
        mount();
        return;
      }
      step.state = 'done';
      step.detail = Math.round(180 + Math.random() * 340) + 'ms';
      refreshTestUI();
    }
    S.test.status = 'ok';
    S.test.message = '';
    applyStatus(forId, 'ok');
    refreshTestUI();
    mount();
    toast('连接成功：' + v.user + '@' + v.host + ':' + v.port + '（原型模拟）');
  }
  function applyStatus(forId, status) {
    if (!forId) return;
    S.connections = S.connections.map(function (c) {
      return c.id === forId ? Object.assign({}, c, { status: status, lastTest: '刚刚' }) : c;
    });
  }
  function testDraft(forceFail) {
    if (!validateDraft()) { refreshErrs(); toast('请先修正标红的字段'); focusFirstBad(); return false; }
    startTest(S.draft, S.editingId, forceFail);
    return true;
  }
  function quickTest(id) {
    var c = connById(id);
    if (!c) return;
    startTest(c, id, false);
  }

  /* ================= 增删改 / 默认 ================= */
  function selectConnection(id) {
    var c = connById(id);
    if (!c) return;
    S.selectedId = id;
    S.editingId = id;
    S.draft = copyConn(c);
    S.editorOpen = true;
    S.dirty = false;
    S.errors = {};
    S.keyCheck = { status: 'idle' };
    S.test = { status: 'idle', steps: [], message: '', forId: null };
    S.confirmDelete = null;
    mount();
  }
  function newConnection() {
    S.selectedId = null;
    S.editingId = null;
    S.draft = copyConn(DEFAULT_NEW);
    S.editorOpen = true;
    S.dirty = false;
    S.errors = {};
    S.keyCheck = { status: 'idle' };
    S.test = { status: 'idle', steps: [], message: '', forId: null };
    S.confirmDelete = null;
    mount();
  }
  function closeEditor() {
    S.editorOpen = false;
    S.confirmDelete = null;
    S.dirty = false;
    mount();
  }
  function cancelEdit() {
    S.confirmDelete = null;
    if (S.editingId) {
      S.draft = copyConn(connById(S.editingId) || DEFAULT_NEW);
      S.dirty = false;
      S.errors = {};
      mount();
      toast('已放弃未保存的修改');
      return;
    }
    if (S.variant === 'A') {
      if (S.connections.length) selectConnection(S.connections[0].id);
      else { S.draft = copyConn(DEFAULT_NEW); S.dirty = false; mount(); }
    } else {
      closeEditor();
    }
  }
  function saveDraft() {
    if (!validateDraft()) { refreshErrs(); toast('请先修正标红的字段'); focusFirstBad(); return; }
    var d = S.draft;
    var id = S.editingId;
    if (id) {
      S.connections = S.connections.map(function (c) {
        return c.id === id ? Object.assign({}, c, { name: d.name, host: d.host, port: d.port, user: d.user, key: d.key, isDefault: !!d.isDefault }) : c;
      });
    } else {
      id = 'c' + Date.now();
      S.connections = S.connections.concat([{
        id: id, name: d.name, host: d.host, port: d.port, user: d.user, key: d.key,
        isDefault: !!d.isDefault, status: 'unknown', lastTest: '未测试'
      }]);
      S.editingId = id;
      S.selectedId = id;
      S.draft.id = id;
    }
    if (d.isDefault) {
      S.connections = S.connections.map(function (c) { return Object.assign({}, c, { isDefault: c.id === id }); });
    }
    S.dirty = false;
    S.savedAt = new Date();
    if (S.variant !== 'A') closeEditor();
    mount();
    toast('已保存「' + d.name + '」（原型不落盘）');
  }
  function setDefault(id) {
    S.connections = S.connections.map(function (c) { return Object.assign({}, c, { isDefault: c.id === id }); });
    if (S.draft && S.editingId === id) S.draft.isDefault = true;
    mount();
    var c = connById(id);
    toast('已设为默认连接：' + (c ? c.name : id));
  }
  function deleteConn(id) {
    if (S.confirmDelete !== id) { S.confirmDelete = id; mount(); return; }
    S.connections = S.connections.filter(function (c) { return c.id !== id; });
    S.confirmDelete = null;
    if (S.editingId === id) {
      S.editingId = null;
      S.selectedId = null;
      if (S.connections.length) {
        var first = S.connections[0];
        S.selectedId = first.id;
        S.editingId = first.id;
        S.draft = copyConn(first);
      } else {
        S.draft = copyConn(DEFAULT_NEW);
        S.editorOpen = S.variant === 'A';
      }
    }
    mount();
    toast('已删除连接');
  }

  /* ================= 编辑器片段 ================= */
  function fieldHtml(name, label, placeholder, hint, cls) {
    var err = S.errors[name];
    return '<label class="fld ' + (cls || '') + '">' +
      '<span class="fldLabel"><span>' + esc(label) + '</span><span class="fldErr" data-err="' + name + '">' + esc(err || '') + '</span></span>' +
      '<input class="dshell-input' + (err ? ' bad' : '') + '" data-field="' + name + '" value="' + esc(S.draft[name] == null ? '' : S.draft[name]) + '" placeholder="' + esc(placeholder) + '" autocomplete="off" spellcheck="false" />' +
      '<span class="fldHint">' + esc(hint || '') + '</span>' +
      '</label>';
  }
  function keyFieldHtml() {
    var err = S.errors.key;
    return '<label class="fld">' +
      '<span class="fldLabel"><span>私钥路径</span><span class="fldErr" data-err="key">' + esc(err || '') + '</span></span>' +
      '<div class="inputRow">' +
      '<input class="dshell-input' + (err ? ' bad' : '') + '" data-field="key" value="' + esc(S.draft.key) + '" placeholder="~/.ssh/id_ed25519" autocomplete="off" spellcheck="false" />' +
      '<button class="dshell-btnGhost smBtn" type="button" data-action="browse-key">浏览…</button>' +
      '</div>' +
      '<span class="fldHint">保存后通过 ssh -i 使用；暂不支持纯密码登录</span>' +
      '</label>';
  }
  function keyChipsHtml() {
    return '<div class="chips"><span class="chipsLabel">常用</span>' +
      KEY_CHIPS.map(function (k) {
        return '<button type="button" class="chip' + (S.draft.key === k ? ' on' : '') + '" data-action="chip-key" data-value="' + esc(k) + '">' + esc(k) + '</button>';
      }).join('') + '</div>';
  }
  function defaultToggleHtml() {
    return '<label class="edToggle"><input type="checkbox" data-field="isDefault"' + (S.draft.isDefault ? ' checked' : '') + ' />设为默认连接（窗口其他功能优先使用）</label>';
  }
  function editorHeadHtml(isNew) {
    var title = isNew ? '新建 SSH 连接' : '编辑连接 · ' + (S.draft.name || '未命名');
    var conn = S.editingId ? connById(S.editingId) : null;
    return '<div class="edHead">' +
      '<div><div class="row" style="gap:8px"><h2>' + esc(title) + '</h2>' +
        (conn ? statusBadge(conn.status, true) : '<span class="dshell-badge">未保存</span>') +
        (S.dirty ? '<span class="protoPill blue">未保存</span>' : '') +
      '</div>' +
      '<div class="sub">' + (isNew ? '填写服务器信息后保存，即可在其他配置里选用' : '修改后点保存生效；测试连接不会改动机器上的任何东西') + '</div></div>' +
      '</div>';
  }
  function editorFootHtml() {
    var del = '';
    if (S.editingId) {
      if (S.confirmDelete === S.editingId) {
        del = '<div class="delConfirm">删除后不可恢复<button class="miniBtn danger" type="button" data-action="delete">确认删除</button><button class="miniBtn" type="button" data-action="delete-cancel">取消</button></div>';
      } else {
        del = '<button class="miniBtn danger" type="button" data-action="delete">删除连接</button>';
      }
    }
    return '<footer class="edFoot"><div class="row">' + del + '</div>' +
      '<div class="right">' +
        '<button class="dshell-btnGhost smBtn" type="button" data-action="cancel">' + (S.editingId ? '放弃修改' : '取消') + '</button>' +
        '<button class="dshell-btnGhost smBtn" type="button" data-action="test-draft" data-test-label="测试连接">测试连接</button>' +
        '<button class="dshell-btn smBtn" type="button" data-action="save">保存</button>' +
      '</div></footer>';
  }

  /* ================= 方案 A · 主从 ================= */
  function renderA() {
    var list = filteredConnections();
    var items = list.length ? list.map(function (c) {
      return '<button type="button" class="ma-item' + (c.id === S.selectedId ? ' on' : '') + '" data-action="select" data-value="' + c.id + '">' +
        '<span class="ma-itemTop"><span class="dot ' + esc(c.status) + '"></span><span class="ma-itemName">' + esc(c.name) + '</span>' + (c.isDefault ? '<span class="ma-itemTag">默认</span>' : '') + '</span>' +
        '<span class="ma-itemAddr">' + esc(c.user) + '@' + esc(c.host) + ':' + esc(c.port) + '</span>' +
        '<span class="ma-itemMeta">' + esc(c.key) + ' · ' + esc(c.lastTest) + '</span>' +
        '</button>';
    }).join('') : '<div class="emptyState"><span class="big">🗝</span><span>' + (S.connections.length ? '当前筛选下没有连接' : '还没有 SSH 连接') + '</span><button class="dshell-btn smBtn" type="button" data-action="new">＋ 新建连接</button></div>';

    var editor;
    if (!S.editorOpen) {
      editor = '<div class="emptyState" style="flex:1"><span class="big">⌁</span><span>从左侧选一条连接，或新建一条</span></div>';
    } else {
      var isNew = !S.editingId;
      editor = '<section class="ma-editor">' + editorHeadHtml(isNew) +
        '<div class="edBody" data-scroll="aEditor">' +
          '<div class="edGrid">' +
            fieldHtml('name', '连接名称', '生产服务器', '用于在列表里区分不同的服务器', 'spanAll') +
            fieldHtml('host', '主机 / IP', '10.20.31.87', 'IPv4 或域名') +
            fieldHtml('port', '端口', '22', '默认 22') +
            fieldHtml('user', '用户名', 'deploy', '服务器登录用户') +
          '</div>' +
          '<div class="edSection"><div class="edSectionTitle">认证密钥</div>' + keyFieldHtml() + keyChipsHtml() +
            '<div class="keyStatus" data-key-status>' + keyStatusHtml() + '</div></div>' +
          defaultToggleHtml() +
          '<pre class="cmdLine" data-live="cmd"></pre>' +
          '<div id="testBox" class="testSlot">' + testBoxHtml() + '</div>' +
          '<div class="dshell-muted" style="font-size:10.5px">原型模拟：<a href="#" data-action="demo-fail">演示失败态</a></div>' +
        '</div>' +
        editorFootHtml() +
        '</section>';
    }
    return '<div class="ma">' +
      '<aside class="ma-side">' +
        '<div class="ma-sideHead"><span>SSH 连接</span><button class="dshell-btnGhost smBtn" type="button" data-action="new">＋ 新建</button></div>' +
        '<div class="ma-filters">' + filtersHtml() + '</div>' +
        '<div class="ma-list" data-scroll="aList">' + items + '</div>' +
      '</aside>' +
      editor +
      '</div>';
  }

  /* ================= 方案 B · 数据表 + 抽屉 ================= */
  function renderB() {
    var list = filteredConnections();
    var rows = list.map(function (c) {
      var confirming = S.confirmDelete === c.id;
      var actions = confirming
        ? '<span class="delConfirm" style="font-size:10.5px">删除？<button class="miniBtn danger" type="button" data-action="delete" data-value="' + c.id + '">确认</button><button class="miniBtn" type="button" data-action="delete-cancel">取消</button></span>'
        : '<button class="miniBtn" type="button" data-action="quick-test" data-value="' + c.id + '" data-test-label="测试">测试</button>' +
          '<button class="miniBtn" type="button" data-action="edit" data-value="' + c.id + '">编辑</button>' +
          (c.isDefault ? '<button class="miniBtn primary" type="button" disabled>默认</button>' : '<button class="miniBtn" type="button" data-action="set-default" data-value="' + c.id + '">设默认</button>') +
          '<button class="miniBtn danger" type="button" data-action="delete" data-value="' + c.id + '">删除</button>';
      return '<tr' + (c.id === S.selectedId ? ' class="on"' : '') + ' data-action="edit" data-value="' + c.id + '">' +
        '<td class="name">' + esc(c.name) + (c.isDefault ? ' <span class="ma-itemTag">默认</span>' : '') + '</td>' +
        '<td class="addr">' + esc(c.host) + ':' + esc(c.port) + '</td>' +
        '<td>' + esc(c.user) + '</td>' +
        '<td class="key">' + esc(c.key) + '</td>' +
        '<td>' + statusBadge(c.status, true) + '</td>' +
        '<td class="dshell-muted" style="font-size:10.5px;white-space:nowrap">' + esc(c.lastTest) + '</td>' +
        '<td><div class="mb-actions">' + actions + '</div></td>' +
        '</tr>';
    }).join('');
    var body = list.length ? '<table class="mb-table"><thead><tr><th>名称</th><th>地址</th><th>用户</th><th>私钥</th><th>状态</th><th>最近测试</th><th style="text-align:right">操作</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="emptyState"><span class="big">🗝</span><span>' + (S.connections.length ? '当前筛选下没有连接' : '还没有 SSH 连接') + '</span><button class="dshell-btn smBtn" type="button" data-action="new">＋ 新建连接</button></div>';

    var drawer = '';
    if (S.editorOpen) {
      var isNew = !S.editingId;
      drawer = '<div class="mb-drawerMask on" data-action="close-editor"></div>' +
        '<aside class="mb-drawer on">' +
          '<div class="mb-drawerHead"><span>' + (isNew ? '新建 SSH 连接' : '编辑连接') + '</span><button class="dshell-btnGhost smBtn x" type="button" data-action="close-editor">✕</button></div>' +
          '<div class="edBody" data-scroll="bDrawer" style="flex:1">' +
            '<div class="edGridC">' +
              fieldHtml('name', '连接名称', '生产服务器', '', 'spanAll') +
              fieldHtml('host', '主机 / IP', '10.20.31.87', 'IPv4 或域名') +
              fieldHtml('port', '端口', '22', '默认 22') +
              fieldHtml('user', '用户名', 'deploy', '服务器登录用户') +
              fieldHtml('key', '私钥路径', '~/.ssh/id_ed25519', '通过 ssh -i 使用', 'spanAll') +
            '</div>' +
            '<div class="chips"><span class="chipsLabel">常用</span>' + KEY_CHIPS.map(function (k) {
              return '<button type="button" class="chip' + (S.draft.key === k ? ' on' : '') + '" data-action="chip-key" data-value="' + esc(k) + '">' + esc(k) + '</button>';
            }).join('') + '</div>' +
            '<div class="keyStatus" data-key-status>' + keyStatusHtml() + '</div>' +
            defaultToggleHtml() +
            '<pre class="cmdLine" data-live="cmd"></pre>' +
            '<div class="testSlot">' + testBoxHtml() + '</div>' +
            '<div class="dshell-muted" style="font-size:10.5px">原型模拟：<a href="#" data-action="demo-fail">演示失败态</a></div>' +
          '</div>' +
          editorFootHtml() +
        '</aside>';
    }
    return '<div class="mb">' +
      '<div class="mb-toolbar">' + filtersHtml() +
        '<div class="right"><span class="dshell-muted" style="font-size:10.5px">共 ' + S.connections.length + ' 条 · 默认 ' + esc((S.connections.filter(function (c) { return c.isDefault; })[0] || { name: '未设置' }).name) + '</span><button class="dshell-btn smBtn" type="button" data-action="new">＋ 新建连接</button></div>' +
      '</div>' +
      '<div class="mb-wrap" data-scroll="bTable">' + body + '</div>' +
      (!S.editorOpen && S.test.status !== 'idle' ? '<div class="mb-test"><div class="testSlot">' + testBoxHtml() + '</div></div>' : '') +
      drawer +
      '</div>';
  }

  /* ================= 方案 C · 卡片网格 + 全屏编辑 ================= */
  function renderC() {
    var list = filteredConnections();
    if (S.editorOpen) {
      var isNew = !S.editingId;
      return '<div class="mc">' +
        '<div class="mc-toolbar"><button class="dshell-btnGhost smBtn" type="button" data-action="close-editor">‹ 返回列表</button>' +
          '<span class="dshell-muted" style="font-size:10.5px" data-live="saved">' + esc(savedText()) + '</span></div>' +
        '<div class="mc-editor">' + editorHeadHtml(isNew) +
          '<div class="edBody" data-scroll="cEditor">' +
            '<div class="edGridC">' +
              fieldHtml('name', '连接名称', '生产服务器', '', 'spanAll') +
              fieldHtml('host', '主机 / IP', '10.20.31.87', 'IPv4 或域名') +
              fieldHtml('port', '端口', '22', '默认 22') +
              fieldHtml('user', '用户名', 'deploy', '服务器登录用户') +
              fieldHtml('key', '私钥路径', '~/.ssh/id_ed25519', '通过 ssh -i 使用', 'spanAll') +
            '</div>' +
            '<div class="chips"><span class="chipsLabel">常用</span>' + KEY_CHIPS.map(function (k) {
              return '<button type="button" class="chip' + (S.draft.key === k ? ' on' : '') + '" data-action="chip-key" data-value="' + esc(k) + '">' + esc(k) + '</button>';
            }).join('') + '</div>' +
            '<div class="keyStatus" data-key-status>' + keyStatusHtml() + '</div>' +
            defaultToggleHtml() +
            '<pre class="cmdLine" data-live="cmd"></pre>' +
            '<div class="testSlot">' + testBoxHtml() + '</div>' +
            '<div class="dshell-muted" style="font-size:10.5px">原型模拟：<a href="#" data-action="demo-fail">演示失败态</a></div>' +
          '</div>' +
          editorFootHtml() +
        '</div>' +
        '</div>';
    }
    var cards = list.length ? list.map(function (c) {
      var confirming = S.confirmDelete === c.id;
      return '<div class="mc-card' + (c.id === S.selectedId ? ' on' : '') + '" data-action="edit" data-value="' + c.id + '">' +
        '<div class="mc-cardHead"><span class="dot ' + esc(c.status) + '"></span><span class="mc-name">' + esc(c.name) + '</span>' +
          (c.isDefault ? '<span class="ma-itemTag" style="margin-left:auto">默认</span>' : '') + '</div>' +
        '<div class="mc-addr">' + esc(c.user) + '@' + esc(c.host) + ':' + esc(c.port) + '</div>' +
        '<div class="mc-kv"><span>' + esc(c.key) + '</span><span>' + esc(cardMetaText(c)) + '</span></div>' +
        '<div class="mc-cardFoot">' +
          (confirming
            ? '<span class="delConfirm" style="font-size:10.5px">删除？<button class="miniBtn danger" type="button" data-action="delete" data-value="' + c.id + '">确认</button><button class="miniBtn" type="button" data-action="delete-cancel">取消</button></span>'
            : '<button class="miniBtn" type="button" data-action="quick-test" data-value="' + c.id + '" data-test-label="测试">测试</button>' +
              '<button class="miniBtn" type="button" data-action="edit" data-value="' + c.id + '">编辑</button>' +
              (c.isDefault ? '' : '<button class="miniBtn" type="button" data-action="set-default" data-value="' + c.id + '">设为默认</button>') +
              '<button class="miniBtn danger" type="button" data-action="delete" data-value="' + c.id + '">删除</button>') +
        '</div>' +
        '</div>';
    }).join('') : '<div class="emptyState" style="grid-column:1/-1"><span class="big">🗝</span><span>' + (S.connections.length ? '当前筛选下没有连接' : '还没有 SSH 连接') + '</span><button class="dshell-btn smBtn" type="button" data-action="new">＋ 新建连接</button></div>';
    return '<div class="mc">' +
      '<div class="mc-toolbar">' + filtersHtml() +
        '<div class="right"><span class="dshell-muted" style="font-size:10.5px">共 ' + S.connections.length + ' 条</span><button class="dshell-btn smBtn" type="button" data-action="new">＋ 新建连接</button></div>' +
      '</div>' +
      '<div class="mc-grid" data-scroll="cGrid">' + cards + '</div>' +
      (S.test.status !== 'idle' ? '<div class="mc-test"><div class="testSlot">' + testBoxHtml() + '</div></div>' : '') +
      '</div>';
  }

  /* ================= 外壳 / 挂载 ================= */
  function render() {
    var area = S.variant === 'A' ? renderA() : S.variant === 'B' ? renderB() : renderC();
    return '<div class="cfg">' +
      '<header class="cfg-top">' +
        '<div>' +
          '<div class="row"><h1 class="dshell-title">配置管理</h1><span class="protoPill">原型</span></div>' +
          '<p class="dshell-sub">bug-solver 的服务器连接与代码项目配置 · 先做 SSH 连接</p>' +
        '</div>' +
        '<div class="row"><span class="dshell-muted" style="font-size:10.5px" data-live="saved">' + esc(savedText()) + '</span></div>' +
      '</header>' +
      '<nav class="cfg-tabs">' +
        '<button class="cfg-tab on" type="button">SSH 连接<span class="cfg-count">' + S.connections.length + '</span></button>' +
        '<button class="cfg-tab" type="button" data-action="next-section">代码项目与分支<span class="cfg-soon">下一步</span></button>' +
      '</nav>' +
      '<div class="cfg-body">' + area + '</div>' +
      '</div>';
  }
  function mount() {
    var scrolls = {};
    root.querySelectorAll('[data-scroll]').forEach(function (node) { scrolls[node.getAttribute('data-scroll')] = node.scrollTop; });
    root.innerHTML = render();
    root.querySelectorAll('[data-scroll]').forEach(function (node) {
      var k = node.getAttribute('data-scroll');
      if (scrolls[k] != null) node.scrollTop = scrolls[k];
    });
    refreshLive();
    var meta = VARIANTS.filter(function (v) { return v.key === S.variant; })[0];
    swLabel.innerHTML = '<b>' + meta.key + '</b> · ' + meta.name;
    var def = S.connections.filter(function (c) { return c.isDefault; })[0];
    swState.textContent = S.connections.length + ' 条连接 · 默认 ' + (def ? def.name : '未设置');
  }
  function setVariant(key, push) {
    if (['A', 'B', 'C'].indexOf(key) < 0) key = 'A';
    S.variant = key;
    S.confirmDelete = null;
    S.test = { status: 'idle', steps: [], message: '', forId: null };
    if (key === 'A') {
      S.editorOpen = true;
      if (!S.editingId && S.connections.length) {
        var c = S.connections[0];
        S.selectedId = c.id; S.editingId = c.id; S.draft = copyConn(c);
      }
    } else {
      S.editorOpen = false;
    }
    if (push) { try { history.replaceState(null, '', '?variant=' + key); } catch (e) { /* ignore */ } }
    mount();
  }
  function cycle(delta) {
    var idx = 0;
    VARIANTS.forEach(function (v, i) { if (v.key === S.variant) idx = i; });
    var next = VARIANTS[(idx + delta + VARIANTS.length) % VARIANTS.length];
    setVariant(next.key, true);
  }

  /* ================= 事件（委托） ================= */
  function onClick(ev) {
    var target = ev.target.closest ? ev.target.closest('[data-action]') : null;
    if (!target) return;
    var action = target.getAttribute('data-action');
    var value = target.getAttribute('data-value');
    if (action === 'new') { ev.preventDefault(); newConnection(); return; }
    if (action === 'select' || action === 'edit') { ev.preventDefault(); selectConnection(value); return; }
    if (action === 'close-editor') { ev.preventDefault(); closeEditor(); return; }
    if (action === 'cancel') { ev.preventDefault(); cancelEdit(); return; }
    if (action === 'save') { ev.preventDefault(); saveDraft(); return; }
    if (action === 'delete') { ev.preventDefault(); deleteConn(value || S.editingId); return; }
    if (action === 'delete-cancel') { ev.preventDefault(); S.confirmDelete = null; mount(); return; }
    if (action === 'set-default') { ev.preventDefault(); setDefault(value); return; }
    if (action === 'quick-test') { ev.preventDefault(); quickTest(value); return; }
    if (action === 'test-draft') { ev.preventDefault(); testDraft(false); return; }
    if (action === 'demo-fail') { ev.preventDefault(); testDraft(true); return; }
    if (action === 'filter') { ev.preventDefault(); S.filter = value; S.confirmDelete = null; mount(); return; }
    if (action === 'chip-key') { ev.preventDefault(); S.draft.key = value; if (S.errors.key) delete S.errors.key; S.dirty = true; mount(); checkKey(); return; }
    if (action === 'browse-key') { ev.preventDefault(); toast('原型占位：正式版会打开工作台的文件选择器（/api/worktable/fs），也可以直接粘贴路径'); return; }
    if (action === 'next-section') { ev.preventDefault(); toast('接下来做「代码项目与 git 分支」：先选项目，再从服务器仓库读分支'); return; }
    if (action === 'noop') { ev.preventDefault(); return; }
  }

  function onInput(ev) {
    var node = ev.target;
    var field = node.getAttribute('data-field');
    if (!field) return;
    if (node.type === 'checkbox') {
      S.draft[field] = node.checked;
    } else {
      S.draft[field] = node.value;
      if (S.errors[field]) { delete S.errors[field]; refreshErrs(); }
    }
    S.dirty = true;
    refreshLive();
  }

  function onChange(ev) {
    if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-field') === 'key') checkKey();
  }
  function onFocusOut(ev) {
    if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-field') === 'key') checkKey();
  }

  root.addEventListener('click', onClick);
  root.addEventListener('input', onInput);
  root.addEventListener('change', onChange);
  root.addEventListener('focusout', onFocusOut);

  document.getElementById('prevBtn').addEventListener('click', function () { cycle(-1); });
  document.getElementById('nextBtn').addEventListener('click', function () { cycle(1); });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); cycle(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); cycle(1); }
  });

  /* ================= 启动 ================= */
  var params = new URLSearchParams(location.search);
  var initial = (params.get('variant') || 'A').toUpperCase();
  S.variant = ['A', 'B', 'C'].indexOf(initial) >= 0 ? initial : 'A';
  S.editorOpen = S.variant === 'A';
  mount();
  setTimeout(function () {
    if (!params.get('variant')) toast('原型：底部 ← → 可切换三种管理方式，先看看哪种顺手');
  }, 900);
})();
</script>
</body>
</html>
