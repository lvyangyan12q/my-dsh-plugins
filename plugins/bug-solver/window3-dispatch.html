<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>窗口3 · 调度台</title>
<link rel="stylesheet" href="/api/worktable/template/dshell.css" />
<style>
  /* ============ bug-solver 窗口3：调度台 ============
     UI 方向 B：以「第 N 轮 方案 → 实现 → 审核」为主线的轮次时间线。
     顶部：任务 / 对话（只读）两个页签 + run 摘要。
     控制面：确认、批准方案、退回意见、Stop、通过、去复盘。
     对话：只读镜像（分页、运行中刷新），输入/审批/Stop 永远回 DSH 原生会话。
     数据：桥插件 /api/bug-solver/*；桥不可用时降级为示例数据并禁用全部写操作。 */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { overflow: auto; background: var(--dsw-alias-bg-base, #0b0e14); color: var(--dsw-alias-label-primary, #e6e8eb); }
  button, input, select, textarea { font-family: inherit; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .w3 { max-width: 1360px; margin: 0 auto; padding: 14px 16px 56px; }
  .w3-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .w3-spacer { flex: 1; }
  .w3-hint { color: var(--dsw-alias-label-tertiary, #6b7280); font-size: 11px; }
  .w3-busy { color: #d29922; font-size: 11.5px; }

  /* 头部 + 页签 */
  .w3-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; margin-bottom: 12px; }
  .w3-headMain { min-width: 0; flex: 1 1 380px; }
  .w3-kicker { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-headMain .dshell-title { font-size: 17.5px; line-height: 1.4; margin: 2px 0 3px; overflow-wrap: anywhere; }
  .w3-headMain .dshell-sub { overflow-wrap: anywhere; }
  .w3-headRight { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; padding-top: 4px; }
  .w3-tabs { border-bottom: 0; }

  /* 桥状态提示 */
  .w3-banner { display: flex; align-items: flex-start; gap: 9px; flex-wrap: wrap; padding: 9px 12px; margin-bottom: 10px; border: 1px solid transparent; border-radius: 9px; font-size: 12px; line-height: 1.55; }
  .w3-banner b { flex: none; }
  .w3-banner .w3-bannerActions { margin-left: auto; display: flex; gap: 8px; }
  .w3-banner.is-degraded { color: #e8c877; border-color: rgba(210, 153, 34, .45); background: rgba(210, 153, 34, .09); }
  .w3-banner.is-degraded b { color: #ffd77a; }
  .w3-banner.is-error { color: #ff9a94; border-color: rgba(248, 81, 73, .45); background: rgba(248, 81, 73, .09); }
  .w3-banner code { color: inherit; }
  .w3-notice { display: flex; align-items: flex-start; gap: 8px; padding: 7px 11px; margin-bottom: 10px; border-radius: 8px; border: 1px solid transparent; font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
  .w3-notice.is-error { color: #ff9a94; border-color: rgba(248, 81, 73, .45); background: rgba(248, 81, 73, .08); }
  .w3-notice.is-warn { color: #e8c877; border-color: rgba(210, 153, 34, .4); background: rgba(210, 153, 34, .08); }
  .w3-notice.is-ok { color: #7ee787; border-color: rgba(63, 185, 80, .4); background: rgba(63, 185, 80, .07); }
  .w3-notice.is-info { color: #a9c8f5; border-color: rgba(79, 142, 247, .35); background: rgba(79, 142, 247, .07); }
  .w3-noticeX { margin-left: auto; border: 0; background: none; color: inherit; opacity: .7; cursor: pointer; font-size: 12px; }
  .w3-noticeX:hover { opacity: 1; }

  /* 概览统计 */
  .w3-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 12px; }
  .w3-stat { padding: 9px 11px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 9px; background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); min-width: 0; }
  .w3-stat .l { font-size: 10.5px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-stat .v { font-size: 13px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w3-stat .v.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }

  /* 两栏 */
  .w3-body { display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .w3-main { min-width: 0; }
  .w3-rail { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .w3-rail .dshell-card + .dshell-card { margin-top: 0; }

  .w3-cardHead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
  .w3-cardHead h2 { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .w3-cardHead .w3-hint { margin-left: auto; }

  /* 摘要键值 */
  .w3-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
  .w3-summary .dshell-kvRow { align-items: baseline; border-bottom: 1px dashed rgba(255,255,255,.06); padding-bottom: 4px; font-size: 11.5px; }
  .w3-summary .dshell-kvKey { flex: none; }
  .w3-summary .dshell-kvValue { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w3-summary .dshell-kvValue.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }

  /* 轮次时间线 */
  .w3-timeline { position: relative; padding-left: 22px; }
  .w3-timeline::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: var(--dsw-alias-border-l1, #262b36); }
  .w3-node { position: relative; margin-bottom: 9px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 9px; background: rgba(255,255,255,.017); padding: 10px 12px; }
  .w3-node:last-child { margin-bottom: 0; }
  .w3-node::before { content: ''; position: absolute; left: -20px; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: var(--dsw-alias-label-tertiary, #6b7280); border: 2px solid var(--dsw-alias-bg-base, #0b0e14); box-shadow: 0 0 0 1px var(--dsw-alias-border-l2, #3a4150); }
  .w3-node.is-done::before { background: #3fb950; box-shadow: 0 0 7px rgba(63,185,80,.5); }
  .w3-node.is-current::before { background: #d29922; box-shadow: 0 0 9px rgba(210,153,34,.65); }
  .w3-node.is-future { opacity: .5; }
  .w3-node.is-current { border-color: rgba(210, 153, 34, .38); background: rgba(210, 153, 34, .045); }
  .w3-nodeHead { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .w3-roundNo { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 20px; padding: 0 7px; border-radius: 6px; background: rgba(79,142,247,.14); border: 1px solid rgba(79,142,247,.38); color: #9ecbff; font-size: 10.5px; font-weight: 650; }
  .w3-nodeTitle { font-size: 12.5px; font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .w3-nodeHead .dshell-badge { margin-left: auto; }
  .w3-nodeBody { margin-top: 7px; font-size: 12px; color: var(--dsw-alias-label-secondary, #9aa4b2); line-height: 1.6; }
  .w3-nodeBody p { margin: 0 0 5px; }
  .w3-nodeBody ul { margin: 0 0 6px; padding-left: 18px; }
  .w3-nodeBody li { margin: 1px 0; }
  .w3-section { margin-top: 6px; }
  .w3-section h3 { margin: 0 0 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: var(--dsw-alias-label-tertiary, #6b7280); text-transform: uppercase; }
  .w3-section p, .w3-section ul { color: var(--dsw-alias-label-primary, #e6e8eb); font-size: 12px; }
  .w3-prose { margin: 4px 0 0; padding: 7px 9px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 7px; background: rgba(0,0,0,.18); font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #c9d3e0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
  .w3-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .w3-chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 6px; background: rgba(255,255,255,.02); color: var(--dsw-alias-label-secondary, #9aa4b2); font-size: 10.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w3-chip.mono { font-family: ui-monospace, Consolas, monospace; }
  .w3-planActions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 9px; }
  .w3-planActions .w3-hint { margin-left: auto; }
  .w3-progress { height: 5px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; margin: 8px 0 5px; }
  .w3-progressBar { height: 100%; width: 38%; border-radius: 4px; background: #d29922; animation: w3slide 1.5s ease-in-out infinite alternate; }
  @keyframes w3slide { from { transform: translateX(0); } to { transform: translateX(160%); } }

  /* 确认页 */
  .w3-fieldGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
  .w3-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .w3-field label { font-size: 11px; color: var(--dsw-alias-label-secondary, #9aa4b2); }
  .w3-field .dshell-input { font-size: 12px; }
  .w3-fieldWide { grid-column: 1 / -1; }
  .w3-fieldHint { font-size: 10.5px; color: var(--dsw-alias-label-tertiary, #6b7280); overflow-wrap: anywhere; }
  .w3-checks { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 10px; font-size: 11px; }
  .w3-check[data-ok="1"] { color: #3fb950; }
  .w3-check[data-ok="0"] { color: #d29922; }
  .w3-check [data-check] { color: inherit; }
  .w3-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .w3-actions .w3-hint { margin-left: auto; }

  /* 会话 / 产物 / run 列表 */
  .w3-runItem { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 7px 9px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 8px; background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); color: var(--dsw-alias-label-secondary, #9aa4b2); cursor: pointer; font: inherit; }
  .w3-runItem + .w3-runItem { margin-top: 5px; }
  .w3-runItem:hover { border-color: var(--dsw-alias-border-l2, #3a4150); }
  .w3-runItem.on { border-color: var(--dsw-alias-state-accent-primary, #4f8ef7); background: color-mix(in srgb, var(--dsw-alias-state-accent-primary, #4f8ef7) 10%, transparent); }
  .w3-runItem .t { font-size: 11.5px; color: var(--dsw-alias-label-primary, #e6e8eb); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w3-runItem .m { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-session { padding: 7px 9px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 8px; background: rgba(255,255,255,.02); }
  .w3-session + .w3-session { margin-top: 6px; }
  .w3-sessionHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .w3-sessionName { font-size: 11.5px; color: var(--dsw-alias-label-primary, #e6e8eb); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w3-sessionId { margin-top: 2px; font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--dsw-alias-label-tertiary, #6b7280); overflow-wrap: anywhere; }
  .w3-session .w3-row { margin-top: 5px; }
  .w3-artifact { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,.06); font-size: 11px; }
  .w3-artifact:last-child { border-bottom: 0; }
  .w3-artifact .n { color: var(--dsw-alias-label-primary, #e6e8eb); font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .w3-artifactViewer { margin-top: 8px; padding: 8px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 8px; background: rgba(0,0,0,.2); }
  .w3-artifactViewer .w3-row { gap: 8px; }
  .w3-artifactViewer .w3-prose { max-height: 320px; margin-top: 7px; }
  a.dshell-btn { text-decoration: none; display: inline-flex; align-items: center; }

  /* 空 / 错 / 加载 */
  .w3-state { padding: 26px 18px; text-align: center; color: var(--dsw-alias-label-tertiary, #6b7280); border: 1px dashed var(--dsw-alias-border-l1, #262b36); border-radius: 9px; font-size: 12px; line-height: 1.7; }
  .w3-state b { display: block; color: var(--dsw-alias-label-primary, #e6e8eb); font-size: 13px; margin-bottom: 4px; }
  .w3-state .w3-actions { justify-content: center; }

  /* 对话只读镜像 */
  .w3-chatTabs { display: flex; gap: 4px; border-bottom: 1px solid var(--dsw-alias-border-l1, #262b36); margin-bottom: 9px; }
  .w3-chatTab { padding: 5px 9px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--dsw-alias-label-secondary, #9aa4b2); font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .w3-chatTab.on { color: var(--dsw-alias-label-primary, #e6e8eb); border-bottom-color: var(--dsw-alias-state-accent-primary, #4f8ef7); }
  .w3-count { font-size: 9.5px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--dsw-alias-border-l1, #262b36); color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-readonly { display: flex; gap: 7px; align-items: flex-start; padding: 7px 10px; margin-bottom: 10px; border: 1px solid rgba(79,142,247,.28); border-radius: 8px; background: rgba(79,142,247,.06); color: #a9c8f5; font-size: 11.5px; line-height: 1.55; }
  .w3-chatList { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow: auto; padding-right: 4px; }
  .w3-msg { border-left: 3px solid var(--dsw-alias-border-l2, #3a4150); padding: 1px 0 1px 9px; }
  .w3-msg[data-role="user"] { border-left-color: #4f8ef7; }
  .w3-msg[data-role="assistant"] { border-left-color: #3fb950; }
  .w3-msg[data-role="tool"] { border-left-color: #a371f7; }
  .w3-msg[data-kind="review"] { border-left-color: #d29922; }
  .w3-msgHead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
  .w3-msgRole { font-size: 11px; font-weight: 650; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .w3-msgKind, .w3-msgTool { font-size: 9.5px; padding: 0 5px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 5px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-msgTime { margin-left: auto; font-size: 9.5px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-msgBody { font-size: 12px; color: var(--dsw-alias-label-primary, #e6e8eb); white-space: pre-wrap; overflow-wrap: anywhere; }
  .w3-msg[data-kind="tool"] .w3-msgBody { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: #c7b8ff; background: rgba(0,0,0,.28); border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 6px; padding: 5px 7px; }
  .w3-msg[data-kind="review"] .w3-msgBody { color: #e8c877; }
  .w3-chatFoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--dsw-alias-border-l1, #262b36); }
  .w3-chatFoot .w3-hint { margin-left: auto; }

  .w3-badgeInfo { color: #9ecbff; border-color: rgba(79,142,247,.45); }
  .w3-badgeInfo::before { background: #4f8ef7; box-shadow: 0 0 5px #4f8ef7; }
  .w3-badgeBad { color: #ff9a94; border-color: rgba(248,81,73,.45); }
  .w3-badgeBad::before { background: #f85149; box-shadow: 0 0 5px #f85149; }

  @media (max-width: 1020px) {
    .w3-body { grid-template-columns: minmax(0, 1fr); }
    .w3-rail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .w3-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .w3-fieldGrid, .w3-summary, .w3-rail { grid-template-columns: minmax(0, 1fr); }
    .w3-headRight { width: 100%; }
  }
  /* 深色主题下原生下拉弹层别用系统白底（否则白字看不清） */
  select { color-scheme: dark; }
  select option, select optgroup { background-color: #101521; color: #e9edf5; }
  /* 自由输入：问题描述要能舒服地多行输入 */
  .w3-problemGrid .w3-fieldWide textarea.dshell-input { line-height: 1.55; }
  .w3-problemGrid { margin-bottom: 2px; }
  /* ---- 并行会话板 ---- */
  .w3-tabDot { display: inline-block; min-width: 15px; margin-left: 5px; padding: 0 4px; border-radius: 999px; background: #d29922; color: #14181f; font-size: 10px; line-height: 15px; text-align: center; }
  .w3-board { display: flex; flex-direction: column; gap: 10px; }
  .w3-boardSecHead { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 6px; font-size: 12px; color: var(--dsw-alias-label-secondary, #9aa4b2); }
  .w3-boardSecHead > span:first-child { font-weight: 600; color: var(--dsw-alias-label-primary, #e6e8eb); }
  .w3-boardGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 9px; }
  .w3-runCard { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; border: 1px solid var(--dsw-alias-border-l1, #262b36); border-radius: 9px; background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02)); cursor: pointer; }
  .w3-runCard:hover { border-color: var(--dsw-alias-border-l2, #3a4150); }
  .w3-runCard.on { border-color: var(--dsw-alias-state-accent-primary, #4f8ef7); background: color-mix(in srgb, var(--dsw-alias-state-accent-primary, #4f8ef7) 10%, transparent); }
  .w3-runCard[data-needs-me="1"] { border-color: rgba(210, 153, 34, .55); }
  .w3-runCardHead { display: flex; align-items: center; gap: 7px; }
  .w3-runCardTitle { flex: 1; min-width: 0; font-size: 12px; color: var(--dsw-alias-label-primary, #e6e8eb); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w3-runCardMeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 10px; color: var(--dsw-alias-label-tertiary, #6b7280); }
  .w3-runCardNow { color: var(--dsw-alias-state-accent-primary, #4f8ef7); }
  .w3-runCardActs { display: flex; flex-wrap: wrap; gap: 6px; }
  .w3-needDot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: #d29922; color: #14181f; font-size: 9px; line-height: 13px; text-align: center; }
  .w3-banner.is-warn { color: #e8c877; border-color: rgba(210, 153, 34, .45); background: rgba(210, 153, 34, .09); }
  .w3-banner.is-info { color: var(--dsw-alias-label-secondary, #9aa4b2); border-color: var(--dsw-alias-border-l1, #262b36); background: var(--dsw-alias-fill-l1, rgba(255,255,255,.03)); }
</style>
</head>
<body>
<div class="dshell w3" id="app" data-view="task" data-bridge="loading" data-phase="loading"></div>
<div class="w3-toast" id="toast" style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;padding:7px 14px;border-radius:999px;background:#1b2433;border:1px solid #3a4150;color:#e6e8eb;font-size:12px;opacity:0;pointer-events:none;transition:opacity .18s"></div>
<script>
/*
 * 窗口3 调度台（单文件，dshell 皮肤）。
 *
 * 桥 HTTP 契约（bug-solver 桥插件；仅同源、JSON、无 CORS）：
 *   GET  /api/bug-solver/runs                     -> { runs: RunSummary[] }
 *   GET  /api/bug-solver/run?id=<runId>           -> { run: Run }
 *   GET  /api/bug-solver/messages?runId&role&before&limit
 *                                                 -> { messages: ChatMessage[], before, hasMore }
 *   GET  /api/bug-solver/artifact?runId&name[&download=1]
 *                                                 -> { name, size, sha256, text } / 文本附件
 *   POST /api/bug-solver/start                    <- DispatchDraft -> { run }
 *   POST /api/bug-solver/approve-plan             { runId, round }
 *   POST /api/bug-solver/plan-feedback            { runId, round, feedback }
 *   POST /api/bug-solver/request-changes          { runId, note }

    S.busySince = Date.now();

    } else {
      var pathHint = payload.project && payload.project.localPath ? '（仓库：' + payload.project.localPath + '）' : '';
      S.notice = { kind: 'error', text: '派发失败：' + apiErrorText(res) + pathHint + '。草稿仍保留，可重试。' };
    }
    schedulePoll();
    render();
  }

  /** 删除一条已结束的 run 记录（工作区默认保留，提示路径）。 */
  async function removeRun(runId) {
    if (!runId) return;
    if (!canWrite()) { toast('桥未安装：操作未执行'); return; }
    S.confirmRemove = null;
    S.busy = true;
    S.notice = null;
    render();
    var res = await apiPost('/remove', { runId: runId });
    S.busy = false;
    if (res.kind === 'ok') {
      var kept = res.data && res.data.worktree;
      var wasCurrent = S.run && S.run.id === runId;
      if (wasCurrent) { S.run = null; S.runId = null; S.runError = ''; }
      await refreshRuns({ silent: true });
      if (!S.run) {
        var next = S.runs.filter(function (r) { return isActive(r.state) || runNeedsMe(r); })[0] || S.runs[0] || null;
        if (next) {
          S.runId = next.id;
          await refreshRun({ silent: true });
        }
      }
      S.notice = {
        kind: 'ok',
        text: '已删除这条 run 记录' +
          (kept && kept.path ? '；git 工作区保留在 ' + kept.path + '（要清理可手工 git worktree remove）' : '') + '。'
      };
    } else if (res.kind === 'missing') {
      enterDegraded(apiErrorText(res));
      S.notice = { kind: 'error', text: '删除失败：桥未安装，操作没有执行。' };
    } else {
      S.notice = { kind: 'error', text: '删除失败：' + apiErrorText(res) };
    }
    schedulePoll();
    render();
  }

  async function writeAction(path, body, prefix, nextState) {
    if (!canWrite()) { toast('桥未安装：操作未执行'); return; }
    S.busy = true;
    S.busySince = Date.now();
    S.notice = null;
    render();
    var res = await apiPost(path, body);
    S.busy = false;
    S.busySince = 0;
    if (res.kind === 'ok') {
      var run = res.data && res.data.run;
      if (run) {
        S.run = normalizeRun(run);
        if (S.run.id) S.runId = S.run.id;
      } else if (S.run && nextState) {
        S.run.state = nextState;
      }
      S.runError = '';
      S.notice = null;
      await refreshRun({ silent: true });
      await refreshRuns({ silent: true });
      schedulePoll();
      render();
    } else if (res.kind === 'missing') {
      enterDegraded(apiErrorText(res));
      S.notice = { kind: 'error', text: prefix + '失败：桥未安装或路由不可用，操作没有执行。' };
      render();
    } else {
      S.notice = { kind: 'error', text: prefix + '失败：' + apiErrorText(res) };
      render();
    }
  }

  function approvePlan() {
    if (!S.run) return;
    writeAction('/approve-plan', { runId: S.run.id || S.runId, round: S.run.currentRound || 1 }, '批准方案', 'fix_implementing');
  }
  function submitPlanFeedback() {
    var text = String(S.feedback || '').trim();
    if (!text) { toast('先写退回意见'); return; }
    if (!S.run) return;
    var body = { runId: S.run.id || S.runId, round: S.run.currentRound || 1, feedback: text };
    S.feedbackOpen = false;
    S.feedback = '';
    writeAction('/plan-feedback', body, '退回方案', 'fix_planning');
  }
  function submitRequestChanges() {
    var text = String(S.feedback || '').trim();
    if (!text) { toast('先写再改意见'); return; }
    if (!S.run) return;
    var body = { runId: S.run.id || S.runId, note: text };
    S.feedbackOpen = false;
    S.feedback = '';
    writeAction('/request-changes', body, '要求再改', 'fix_planning');
  }
  function resumeRun() {
    if (!S.run) return;
    writeAction('/resume', { runId: S.run.id || S.runId }, '继续', null);
  }
  function viewArtifact(name) {
    if (!name || S.bridge !== 'ok' || !S.runId) return;
    S.artifact = { name: name, text: '', size: 0, sha256: '', loading: true, error: '' };
    render();
    apiGet('/artifact?runId=' + encodeURIComponent(S.runId) + '&name=' + encodeURIComponent(name)).then(function (res) {
      if (!S.artifact || S.artifact.name !== name) return;
      S.artifact.loading = false;
      if (res.kind === 'ok' && res.data) {
        S.artifact.text = res.data.text || '';
        S.artifact.size = res.data.size || 0;
        S.artifact.sha256 = res.data.sha256 || '';
      } else {
        S.artifact.error = apiErrorText(res);
      }
      render();
    });
  }
  function stopRun() {
    if (!S.run) return;
    writeAction('/stop', { runId: S.run.id || S.runId }, 'Stop', 'stopped');
  }
  function approveRun() {
    if (!S.run) return;
    writeAction('/approve', { runId: S.run.id || S.runId }, '通过', 'approved');
  }

  /* ---------------- 只读对话 ---------------- */

  function loadMessages(role, reset, opts) {
    opts = opts || {};
    var page = S.messages[role];
    if (!page) return Promise.resolve();
    if (S.sample || S.bridge !== 'ok') return Promise.resolve();
    if (!S.runId) { page.loaded = true; return Promise.resolve(); }
    if (page.loading) return Promise.resolve();
    if (!reset && !opts.refresh && !page.more) return Promise.resolve();
    page.loading = true;
    page.error = '';
    // 初始/刷新加载最新一页（无 before）；「加载更早」用 before=本页最旧 seq 向前翻。
    var before = reset || opts.refresh ? null : page.before;
    var url = '/messages?runId=' + encodeURIComponent(S.runId || '') +
      '&role=' + encodeURIComponent(role) + '&limit=' + LIMIT +
      (before ? '&before=' + encodeURIComponent(before) : '');
    return apiGet(url).then(function (res) {
      page.loading = false;
      if (res.kind === 'ok') {
        var data = normalizeMessages(res.data);
        if (reset) {
          page.list = data.list;
          page.before = data.before;
          page.more = data.more;
        } else if (opts.refresh) {
          // 运行中刷新最新一页：按 seq 合并，保留已加载的更早消息与向前游标。
          var hadHistory = page.loaded && page.list.length > 0;
          page.list = mergeMessages(page.list, data.list);
          if (!hadHistory) {
            page.before = data.before;
            page.more = data.more;
          }
        } else {
          page.list = mergeMessages(data.list, page.list);
          page.before = data.before;
          page.more = data.more;
        }
        page.loaded = true;
      } else if (res.kind === 'missing') {
        enterDegraded(apiErrorText(res));
        S.notice = { kind: 'error', text: '对话加载失败：桥未安装或路由不可用。' };
      } else {
        page.error = '加载对话失败：' + apiErrorText(res);
      }
      if (!opts.silent) render();
    });
  }

  function switchChatRole(role) {
    S.chatRole = role === 'review' ? 'review' : 'fix';
    S.view = 'chat';
    render();
    var page = S.messages[S.chatRole];
    if (!page.loaded && !page.loading) loadMessages(S.chatRole, true);
  }

  function openSession(kind, explicitId) {
    var run = S.run;
    var sessionId = explicitId || (kind === 'review' ? (run && run.reviewSessionId) : (run && run.fixSessionId));
    if (!sessionId) { toast('这个会话还没启动'); return; }
    var opened = false;
    [window.top, window.parent, window].forEach(function (win) {
      if (opened || !win) return;
      try {
        if (typeof win.__dshOpenSession === 'function') { win.__dshOpenSession(sessionId); opened = true; }
      } catch (e) { /* 跨域或未实现 */ }
    });
    if (opened) return;
    copyText(sessionId, '无法自动打开 DSH 会话；已复制会话 ID，请在 DSH 里搜索打开。');
  }

  function copyText(text, okMessage) {
    var task = null;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) task = navigator.clipboard.writeText(text);
    } catch (e) { task = null; }
    if (task && typeof task.then === 'function') {
      task.then(function () { toast(okMessage || ('已复制：' + text)); }, function () { toast('复制失败：' + text); });
      return;
    }
    toast(okMessage || text);
  }

  function messageHtml(m, index) {
    var roleLabel = m.role === 'user' ? '你的回答' : (m.role === 'tool' ? '工具' : (m.role === 'system' ? '系统' : 'agent'));
    var kindLabel = m.kind === 'tool' ? '工具调用' : (m.kind === 'plan' ? '方案' : (m.kind === 'review' ? '审核结论' : (m.kind === 'notice' ? '提示' : '')));
    return '<div class="w3-msg" data-msg data-role="' + esc(m.role) + '" data-kind="' + esc(m.kind) + '"' +
      (m.toolName ? ' data-tool="' + esc(m.toolName) + '"' : '') + '>' +
      '<div class="w3-msgHead"><span class="w3-msgRole">' + esc(roleLabel) + '</span>' +
      (kindLabel ? '<span class="w3-msgKind">' + esc(kindLabel) + '</span>' : '') +
      (m.toolName ? '<span class="w3-msgTool">' + esc(m.toolName) + '</span>' : '') +
      (m.at ? '<span class="w3-msgTime">' + esc(fmtAt(m.at)) + '</span>' : '') +
      '</div><div class="w3-msgBody">' + esc(m.text) + '</div></div>';
  }

  function chatHtml() {
    var page = S.messages[S.chatRole] || blankPage();
    var fixCount = S.messages.fix.list.length + (S.messages.fix.more ? '+' : '');
    var reviewCount = S.messages.review.list.length + (S.messages.review.more ? '+' : '');
    var sessionKind = S.chatRole === 'review' ? 'review' : 'fix';
    var body;
    if (!page.loaded && page.loading) {
      body = '<div class="w3-state">正在加载对话镜像…</div>';

      body = '<div class="w3-state" data-chat-error><b>对话加载失败</b>' + esc(page.error) + '</div>';
    } else if (!page.list.length) {
      body = '<div class="w3-state"><b>还没有消息</b>镜像可能落后；以 DSH 原生会话为准。</div>';
    } else {
      body = page.list.map(messageHtml).join('');
    }
    return '<div class="dshell-card" data-card="chat">' +
      '<div class="w3-cardHead"><h2>对话（只读镜像）</h2>' +
      (S.sample ? badge('示例数据', 'wait') : badge('只读', 'info')) +
      '<span class="w3-hint">' + esc(S.chatRole === 'review' ? '审核会话' : '分析修复会话') + (S.sample ? '' : ' · 运行中自动刷新') + '</span></div>' +
      '<div class="w3-chatTabs">' +
        '<button class="w3-chatTab' + (S.chatRole === 'fix' ? ' on' : '') + '" data-chat-role="fix">分析修复 <span class="w3-count">' + esc(fixCount) + '</span></button>' +
        '<button class="w3-chatTab' + (S.chatRole === 'review' ? ' on' : '') + '" data-chat-role="review">审核 <span class="w3-count">' + esc(reviewCount) + '</span></button>' +
      '</div>' +
      '<div class="w3-readonly" data-readonly-banner><span>🔒</span><span>只读镜像：窗口3 不提供输入、发送、审批；回复、审批、提问、Stop 请回 DSH 原生会话。消息文本由桥脱敏后原样展示。</span></div>' +
      '<div class="w3-chatList" data-chat-list data-has-more="' + (page.more ? '1' : '0') + '">' + body + '</div>' +
      '<div class="w3-chatFoot">' +
        (page.more ? '<button class="dshell-btn dshell-btnGhost" data-act="load-more"' + (page.loading ? ' disabled' : '') + '>' + (page.loading ? '加载中…' : '加载更早') + '</button>' : '') +
        '<span class="w3-hint">镜像可能落后；状态机不依赖镜像。</span>' +
        '<button class="dshell-btn" data-act="open-session" data-session="' + sessionKind + '">在 DSH 打开并回复</button>' +
      '</div></div>';
  }

  /* ---------------- 渲染：头部 / 提示 ---------------- */

  function bugOf() {
    if (S.draft && S.draft.bug) return S.draft.bug;
    if (S.run) {
      if (S.run.bug && (S.run.bug.title || S.run.bug.uid != null)) return S.run.bug;
      return { uid: S.run.bugUid, title: S.run.bugTitle || '' };
    }
    return {};
  }
  function titleText() {
    var bug = bugOf();
    var prefix = bug.source === 'manual' ? '自由输入' : (bug.uid != null ? 'BUG-' + bug.uid : (bug.id || ''));
    var title = bug.title || '等待窗口1 派发缺陷';
    return (prefix ? prefix + ' · ' : '') + title;
  }
  function currentService() {
    if (S.run && S.run.service) return S.run.service;
    if (S.run && S.run.bug && S.run.bug.service) return S.run.bug.service;
    if (S.draft && S.draft.bug && S.draft.bug.service) return S.draft.bug.service;
    return '服务未知';
  }
  function currentConnection() {
    if (S.draft) return selectedConnection() || S.draft.connection || null;
    return (S.run && S.run.connection) || (S.draft && S.draft.connection) || null;
  }
  function currentProject() {
    if (S.draft) return selectedProject() || S.draft.project || null;
    return (S.run && S.run.project) || (S.draft && S.draft.project) || null;
  }
  function currentSpec() {
    var spec = (S.draft && S.draft.specRef) || (S.run && S.run.specRef) || null;
    if (!spec) return null;
    return spec;
  }
  function subtitleText() {
    var conn = currentConnection();
    var proj = currentProject();
    var spec = currentSpec();
    var parts = [currentService()];
    if (conn) parts.push((conn.name || '连接') + ' · ' + (conn.user || '?') + '@' + (conn.host || '?'));
    if (proj) parts.push(proj.name || proj.localPath || '项目');
    if (spec && spec.kind && spec.kind !== 'none') parts.push(spec.feature || spec.path || 'spec');
    return parts.join(' · ');
  }
  function phaseAttr() {
    if (S.draft) return 'draft';
    if (S.run) return S.run.state || 'unknown';
    if (S.bridge === 'loading') return 'loading';
    if (S.bridge === 'error') return 'error';
    return 'none';
  }
  function currentPhase() {
    if (S.draft) return phaseInfo('draft');
    if (S.run) return phaseInfo(S.run.state);
    if (S.bridge === 'loading') return phaseInfo('loading');
    if (S.bridge === 'error') return phaseInfo('error');
    return phaseInfo('none');
  }

  /** 忙碌时的可见反馈：让用户知道还在等，而不是「没反应」。 */
  function busyText() {
    if (!S.busySince) return '处理中…';
    var sec = Math.max(0, Math.round((Date.now() - S.busySince) / 1000));
    return '处理中… 已等待 ' + sec + 's';
  }

      '</div>' +
      '<div class="w3-headRight">' +
        '<div class="dshell-tabs w3-tabs">' +
          '<button class="dshell-tab' + (S.view === 'task' ? ' dshell-tabOn' : '') + '" data-view="task">任务</button>' +

      '</div>' +

  function bannerHtml() {

      return '<div class="w3-banner is-degraded" data-bridge-banner data-kind="degraded" role="alert">' +

      '</div>';

      return '<div class="w3-banner is-error" data-bridge-banner data-kind="error" role="alert">' +

  /* ---------------- 渲染：概览 / 主区 ---------------- */

  /** run/草稿的日志时间窗文字（含过期提示）。 */
  function runWindowText() {
    var tw = (S.run && S.run.draft && S.run.draft.timeWindow) || (S.draft && S.draft.timeWindow) || null;
    var win = windowDisplayValues();
    var from = tw && tw.from ? displayTime(tw.from) : win.from;
    var to = tw && tw.to ? displayTime(tw.to) : win.to;
    if (!from && !to) return '—';
    var text = (from || '?') + ' ~ ' + (to || '?');
    var mode = tw && tw.mode === 'custom' ? '（自定义）' : (tw && tw.mode === 'rolling' ? '（滚动）' : '');
    var age = windowAgeOf(new Date(to).getTime());
    return text + mode + (age && age.stale ? ' · ' + age.text : '');
  }

  function summaryHtml() {
    var conn = currentConnection();
    var proj = currentProject();
    var spec = currentSpec();
    var bug = bugOf();
    var stateLabel = S.draft ? '待确认信息' : (S.run ? phaseInfo(S.run.state).label : '未开始');
    var rows = [
      kv('来源', bug.source === 'manual' ? '自由输入（用户描述）' : '窗口1 派发的缺陷'),
      kv(bug.source === 'manual' ? '问题' : '缺陷', bug.source === 'manual' ? (bug.title || '—') : (bug.uid != null ? 'BUG-' + bug.uid : (bug.id || '—')), true),
      kv('服务', currentService(), true),
      kv('SSH 连接', conn ? ((conn.name || '连接') + ' · ' + (conn.user || '?') + '@' + (conn.host || '?') + ':' + (conn.port || '22')) : '—', true),
      kv('代码仓库', (S.form && S.form.localPath) || (proj && proj.localPath) || '—', true),
      kv('基线 / 分支', S.run ? ((S.run.baseBranch || '—') + ' / ' + (S.run.branch || '—')) : ((S.form && S.form.baseBranch) || (proj && proj.baseBranch) || '—'), true),
      kv('工作区', (S.run && S.run.worktree && S.run.worktree.path) || (S.run && S.run.repoPath) || '—', true),
      kv('会话目录', (S.run && S.run.sessionCwd) || (S.run && S.run.localPath) || '—', true),
      kv('日志时间窗', runWindowText(), true),
      kv('目标 spec', spec && spec.kind !== 'none' ? (spec.path || spec.feature || '—') : '无（只按 diff + 缺陷描述）', true),
      kv('状态', stateLabel)
    ].join('');
    return '<div class="dshell-card" data-card="run-summary">' +
      '<div class="w3-cardHead"><h2>run 摘要</h2>' +
        (S.sample ? badge('示例数据', 'wait') : '') +
        '<span class="w3-hint">' + esc(S.run && S.run.id ? 'run ' + S.run.id : (S.draft && S.draft.runId ? '草稿 ' + S.draft.runId : '')) + '</span>' +
      '</div><div class="w3-summary">' + rows + '</div></div>';
  }

  function loadingCard() {
    return '<div class="dshell-card"><div class="w3-state" data-card="loading"><b>正在连接 bug-solver 桥…</b>读取 run 列表与当前状态。</div></div>';
  }
  function errorCard() {
    return '<div class="dshell-card"><div class="w3-state" data-card="error"><b>桥不可用</b>' +
      esc(S.bridgeError || '桥返回了错误') +
      '<div class="w3-actions"><button class="dshell-btn dshell-btnGhost" data-act="retry-bridge">重试</button></div></div></div>';
  }
  function emptyCard() {
    return '<div class="dshell-card"><div class="w3-state" data-card="empty"><b>还没有 run</b>' +
      '两条入口：① 在窗口1 点「派发到窗口3」——按缺陷分析；② 直接「分析一个问题」——不用缺陷单，自己描述现象。' +
      '<div class="w3-actions"><button class="dshell-btn" data-act="new-manual">分析一个问题</button>' +
      '<button class="dshell-btn dshell-btnGhost" data-act="refresh">刷新</button></div></div></div>';

  /* ---------------- 并行会话：跨 run 的工具 ---------------- */

  /** 需要你动手的 run 状态（方案待批、待你通过、需要回复）。 */
  var NEEDS_ME = { needs_attention: 1, awaiting_plan_approval: 1, awaiting_user_approval: 1 };
  function runNeedsMe(run) { return !!(run && NEEDS_ME[run.state]); }
  function pendingRunCount() {
    var n = 0;
    for (var i = 0; i < S.runs.length; i++) if (runNeedsMe(S.runs[i])) n++;
    return n;
  }
  function runLabelOf(r) {
    if (!r) return 'run';
    if (r.bugUid != null) return 'BUG-' + r.bugUid;
    if (r.bugSource === 'manual') return '自由输入';
    return r.bugId || r.id || 'run';
  }
  function runTitleOf(r) {
    if (!r) return '';
    var label = runLabelOf(r);
    return r.bugTitle ? label + ' · ' + r.bugTitle : label;
  }
  function normPath(p) {
    return String(p || '').trim().replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
  }
  function baseNameOf(p) {
    var v = String(p || '').trim().replace(/[\\/]+$/, '');
    if (!v) return '';
    var parts = v.split(/[\\/]/);
    return parts[parts.length - 1] || v;
  }
  function fmtAgo(ts) {
    var t = Number(ts);
    if (!t) return '';
    var diff = Date.now() - t;
    if (diff < 0) diff = 0;
    var m = Math.floor(diff / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }
  /** 同一仓库上已活跃的 run（桥会用 409 repo-busy 拒绝并行派发）；
   *  exceptBugId：同一缺陷是幂等返回，不算冲突。 */
  function activeRunOnRepo(localPath, exceptBugId) {
    var key = normPath(localPath);
    if (!key) return null;
    for (var i = 0; i < S.runs.length; i++) {
      var r = S.runs[i];
      if (!r.localPath || !isActive(r.state)) continue;
      if (exceptBugId && r.bugId === exceptBugId) continue;
      if (normPath(r.localPath) === key) return r;
    }
    return null;
  }
  function sortedRuns() {
    var list = S.runs.slice();
    var rank = function (r) { return runNeedsMe(r) ? 0 : (isActive(r.state) ? 1 : 2); };
    list.sort(function (a, b) {
      var d = rank(a) - rank(b);
      if (d !== 0) return d;
      return (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0);
    });
    return list;
  }
  /** 同仓库已有活跃 run 时的说明：现在允许并行，各自另开工作区。 */
  /** 自定义窗口太旧时提醒（滚动窗口不会触发）。 */
  function staleWindowHtml() {
    if (!S.form || S.form.windowMode !== 'custom') return '';
    var end = new Date(S.form.to).getTime();
    var age = windowAgeOf(end);
    if (!age || !age.stale) return '';
    return '<div class="w3-banner is-warn" data-window-stale="1" role="alert">' +
      '<b>日志时间窗偏旧</b>' +
      '<span>' + esc(S.form.from) + ' ~ ' + esc(S.form.to) + '（' + esc(age.text) + '）。' +
        '分析会话可能查不到日志；想按现在查就切回「最近 3 天（滚动）」。</span>' +
      '</div>';
  }

  function sameRepoHintHtml() {
    var bugId = S.draft && S.draft.bug && S.draft.bug.id;
    var busy = activeRunOnRepo(S.form && S.form.localPath, bugId);
    if (!busy) return '';
    return '<div class="w3-banner is-info" data-same-repo="1" role="status">' +
      '<b>同仓库已有活跃 run</b>' +
      '<span>' + esc(runTitleOf(busy)) + '（' + esc(phaseInfo(busy.state).label) + '）正在跑。' +
        '派发后这条会另开独立工作区与分支，两条并行互不影响。</span>' +
      '<span class="w3-bannerActions"><button class="dshell-btn dshell-btnGhost" data-act="select-run" data-run-id="' + esc(busy.id) + '">先看那条</button></span>' +
      '</div>';
  }
  /** 窗口1 还在等确认的草稿数（不含当前正在确认的这条）。 */
  function pendingDraftCount(exceptId) {
    try {
      var raw = localStorage.getItem(DRAFT_MAP_KEY);
      var map = raw ? JSON.parse(raw) : null;
      var drafts = map && map.drafts && typeof map.drafts === 'object' ? map.drafts : null;
      if (!drafts) return 0;
      var n = 0;
      Object.keys(drafts).forEach(function (id) {
        var item = drafts[id];
        if (!item || !item.bug) return;
        if (item.status === 'confirmed') return;
        if (exceptId && (id === exceptId || (item.bug && item.bug.id) === exceptId)) return;
        n++;
      });
      return n;
    } catch (e) { return 0; }
  }

  function writeBtn(act, label, cls) {
    var disabled = !canWrite();
    return '<button class="dshell-btn ' + (cls || '') + '" data-act="' + act + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>';
  }
  function ghostBtn(act, label, attrs) {
    return '<button class="dshell-btn dshell-btnGhost" data-act="' + act + '"' + (attrs || '') + '>' + label + '</button>';
  }

  function confirmCard() {
    var draft = S.draft;
    var bug = draftBug();
    var manual = bug.source === 'manual';
    var winView = windowDisplayValues();
    var conns = connectionOptions();
    var conn = selectedConnection();
    var spec = (S.form && S.form.specPath) || '';
    var connOptions = conns.map(function (c) {

      (manual

              '<input class="dshell-input" id="w3-problemTitle" data-field="bugTitle" value="' + esc(bug.title || '') + '" placeholder="例如：通讯录导入偶发 500" autocomplete="off" spellcheck="false" />' +

              '<div class="w3-fieldHint">这段文字会作为分析上下文进会话；留空的 title 会自动取描述首行。</div>' +
            '</div>' +
          '</div>'
        : '') +
      '<div class="w3-fieldGrid">' +
        '<div class="w3-field"><label for="w3-conn">SSH 连接</label>' +
          (connOptions.length
            ? '<select class="dshell-input" id="w3-conn" data-field="connectionId">' + connOptions + '</select>'
            : '<div class="w3-fieldHint">窗口2 里还没有可用连接；先去窗口2 配一条。</div>') +
        '</div>' +
        '<div class="w3-field"><label for="w3-base">基线分支</label>' +
          '<input class="dshell-input" id="w3-base" data-field="baseBranch" value="' + esc(S.form && S.form.baseBranch || '') + '" placeholder="留空 = 仓库当前分支" autocomplete="off" spellcheck="false" />' +
          '<div class="w3-fieldHint">留空 = 用仓库当前分支（HEAD）；填了但分支不存在会自动回退到当前分支并提示。</div>' +
        '</div>' +

          '<input class="dshell-input" id="w3-local" data-field="localPath" value="' + esc(S.form && S.form.localPath || '') + '" placeholder="E:\\work\\projects\\dcom" autocomplete="off" spellcheck="false" />' +
          '<div class="w3-fieldHint">由窗口3 直接指定；桥会校验路径在 allowedRoots 内且是干净 git 仓库。</div>' +
        '</div>' +
        '<div class="w3-field"><label for="w3-specKind">目标 spec</label>' +
          '<select class="dshell-input" id="w3-specKind" data-field="specKind">' +
            '<option value="file"' + (S.form && S.form.specKind === 'file' ? ' selected' : '') + '>文件（仓库内或仓库外绝对路径）</option>' +
            '<option value="url"' + (S.form && S.form.specKind === 'url' ? ' selected' : '') + '>URL</option>' +
            '<option value="none"' + (S.form && S.form.specKind === 'none' ? ' selected' : '') + '>无（只按 diff + 缺陷描述）</option>' +
          '</select>' +

          '<div class="w3-fieldHint">选「文件」时可填目标仓库内相对路径，或仓库外绝对路径（如 F:\\docs\\spec.md）；选「无」则只按缺陷描述与 diff 判断。</div>' +

        '<div class="w3-field"><label for="w3-container">容器名（可选）</label>' +
          '<input class="dshell-input" id="w3-container" data-field="container" value="' + esc(S.form && S.form.container || '') + '" placeholder="留空：按项目名查 docker ps" autocomplete="off" spellcheck="false" />' +
          '<div class="w3-fieldHint">留空时分析会话会先用只读 docker ps 按项目/服务名匹配容器。</div>' +
        '</div>' +
        '<div class="w3-field"><label for="w3-window">日志时间窗</label>' +
          '<select class="dshell-input" id="w3-window" data-field="windowPreset">' +
            Object.keys(WINDOW_PRESETS).map(function (key) {
              return '<option value="' + key + '"' + ((S.form && S.form.windowPreset) === key ? ' selected' : '') + '>' + esc(WINDOW_PRESETS[key].label) + '（滚动）</option>';
            }).join('') +

          '</select>' +
          '<div class="w3-fieldHint">' + (winView.rolling ? '滚动窗口：派发时按当时时间计算，不会冻结。' : '固定时间窗：按下面填写的时间派发。') + '</div>' +
        '</div>' +
