          '<input class="dshell-input" type="datetime-local" data-field="to" value="' + esc(winView.to) + '" aria-label="日志时间窗结束" style="flex:1;min-width:0"' + (winView.rolling ? ' disabled title="滚动窗口自动计算"' : '') + ' /></div>' +
        '</div>' +
        '<div class="w3-field w3-fieldWide"><label for="w3-notes">补充说明（会进修复会话的上下文）</label>' +
          '<textarea class="dshell-input" id="w3-notes" data-field="notes" rows="3" placeholder="例如：只复现于工单通知；通讯录用户没有地区字段">' + esc(S.form && S.form.notes || '') + '</textarea>' +
        '</div>' +
      '</div>' +
      '<div data-same-repo-slot>' + sameRepoHintHtml() + '</div>' +
      '<div data-window-warn-slot>' + staleWindowHtml() + '</div>' +
      '<div class="w3-checks" data-validation>' + checksHtml() + '</div>' +
      '<div class="w3-actions">' +
        '<button class="dshell-btn" data-act="confirm-dispatch"' + (canGo ? '' : ' disabled') + '>确认并派发</button>' +
        ghostBtn('save-draft', '保存草稿') +
        ghostBtn('discard-draft', '放弃草稿') +
        '<span class="w3-hint">' + (canWrite() ? '派发后进入第 1 轮方案；批准前不会产生 commit。' : '桥未安装：写操作已禁用，确认信息仍可查看/保存。') + '</span>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- 渲染：轮次时间线 ---------------- */

  function stageStates(run, round) {
    var cur = run.currentRound || 1;
    var state = run.state;
    var approved = !!round.planApprovedAt;
    var verdict = round.verdict || (round.review && round.review.verdict) || '';
    var commit = round.commit;
    var reviewStates = ['review_starting', 'review_running', 'review_done', 'awaiting_user_approval', 'approved'];

    if (round.round < cur) {
      var implDone = !!commit || verdict || reviewStates.indexOf(state) >= 0 || state === 'fix_done';
      return { plan: 'done', implement: implDone ? 'done' : (state === 'fix_implementing' ? 'current' : 'future'), review: verdict ? 'done' : 'future' };
    }
    if (round.round > cur) {
      return { plan: 'future', implement: 'future', review: 'future' };
    }
    if (state === 'draft' || state === 'confirmed') {
      return { plan: 'future', implement: 'future', review: 'future' };
    }
    if (state === 'fix_planning' || state === 'awaiting_plan_approval') {
      return { plan: 'current', implement: 'future', review: 'future' };
    }
    if (state === 'fix_implementing') {
      return { plan: approved ? 'done' : 'current', implement: 'current', review: 'future' };
    }
    if (state === 'fix_done') {
      return { plan: 'done', implement: 'done', review: 'future' };
    }
    if (state === 'review_starting' || state === 'review_running') {
      return { plan: 'done', implement: 'done', review: 'current' };
    }
    if (state === 'review_done' || state === 'awaiting_user_approval' || state === 'approved') {
      return { plan: 'done', implement: 'done', review: 'done' };
    }
    if (state === 'needs_attention') {
      if (!approved) return { plan: 'current', implement: 'future', review: 'future' };
      if (!commit) return { plan: 'done', implement: 'current', review: 'future' };
      return { plan: 'done', implement: 'done', review: verdict ? 'done' : 'current' };
    }
    if (state === 'stopped' || state === 'fix_failed' || state === 'review_failed' || state === 'unknown') {
      return {
        plan: approved ? 'done' : 'current',
        implement: commit ? 'done' : (approved ? 'current' : 'future'),
        review: verdict ? 'done' : (commit ? 'current' : 'future')
      };
    }
    return {
      plan: approved ? 'done' : 'future',
      implement: commit ? 'done' : 'future',
      review: verdict ? 'done' : 'future'
    };
  }

  function roundsToRender(run) {
    var seen = {};
    (run.rounds || []).forEach(function (r) { seen[r.round || 1] = 1; });
    seen[run.currentRound || 1] = 1;
    return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
  }

  function roundOf(run, n) {
    for (var i = 0; i < (run.rounds || []).length; i++) {
      if (run.rounds[i].round === n) return run.rounds[i];
    }
    return { round: n };
  }

  function nodeShell(roundNo, title, state, badgeHtml, bodyHtml) {
    var cls = state === 'done' ? 'is-done' : (state === 'current' ? 'is-current' : 'is-future');
    return '<div class="w3-node ' + cls + '" data-node="round-' + roundNo + '-' + title.key + '" data-node-state="' + state + '">' +
      '<div class="w3-nodeHead"><span class="w3-roundNo">第 ' + roundNo + ' 轮</span>' +
      '<span class="w3-nodeTitle">' + esc(title.label) + '</span>' + badgeHtml + '</div>' +
      '<div class="w3-nodeBody">' + bodyHtml + '</div></div>';
  }

  function planBody(run, round, state) {
    var plan = round.plan;
    var planText = typeof plan === 'string'
      ? plan
      : (round.planText || (round.round === run.currentRound && typeof run.plan === 'string' ? run.plan : '') || '');
    var out = '';
    if (plan && typeof plan === 'object') {
      if (plan.diagnosis) out += '<div class="w3-section"><h3>诊断</h3><p>' + esc(plan.diagnosis) + '</p></div>';
      if (plan.changes && plan.changes.length) out += '<div class="w3-section"><h3>改什么</h3><ul>' + plan.changes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      if (plan.tests && plan.tests.length) out += '<div class="w3-section"><h3>怎么测</h3><ul>' + plan.tests.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      if (plan.risk) out += '<div class="w3-section"><h3>风险</h3><p>' + esc(plan.risk) + '</p></div>';
      if (plan.files && plan.files.length) out += '<div class="w3-chips">' + plan.files.map(function (f) { return '<span class="w3-chip mono">' + esc(f) + '</span>'; }).join('') + '</div>';
    } else if (planText) {
      out += '<pre class="w3-prose" data-scroll-key="plan-' + round.round + '">' + esc(planText) + '</pre>';
    } else if (round.planPath) {
      out += '<p>方案已生成：<code>' + esc(round.planPath) + '</code>（正文以 DSH 会话语义与产物为准）。</p>';
    } else if (state === 'current' && run.state === 'fix_planning') {
      out += '<p>修复会话正在读 spec / 缺陷 / 上一轮审核结论，写第 ' + round.round + ' 轮方案。完成后等你批准。</p>';
    } else if (state === 'future') {
      out += '<p>未开始。</p>';
    }
    if (round.planFeedback) {
      out += '<div class="w3-section"><h3>退回意见</h3><p>' + esc(round.planFeedback) + '</p></div>';
    }
    if (round.planApprovedAt) {
      out += '<p class="w3-hint">已于 ' + esc(fmtAt(round.planApprovedAt)) + ' 批准。</p>';
    }
    if (state === 'current' && run.state === 'awaiting_plan_approval') {
      out += '<div class="w3-planActions">' +
        writeBtn('approve-plan', '批准方案', '') +
        ghostBtn('toggle-feedback', '退回修改') +
        writeBtn('stop', 'Stop', 'dshell-btnDanger') +
        '<span class="w3-hint">' + (S.sample ? '示例：写操作已禁用' : '批准前不会产生 commit') + '</span>' +
      '</div>';
      if (S.feedbackOpen) {
        out += '<div class="w3-field w3-fieldWide" style="margin-top:8px"><label for="w3-feedback">退回意见（会进下一版方案）</label>' +
          '<textarea class="dshell-input" id="w3-feedback" data-field="plan-feedback" rows="3" placeholder="例如：不要静默回退默认地区，先补集成测试">' + esc(S.feedback) + '</textarea></div>' +
          '<div class="w3-planActions">' +
          '<button class="dshell-btn" data-act="submit-plan-feedback"' + (canWrite() && String(S.feedback).trim() ? '' : ' disabled') + '>提交退回意见</button>' +
          '<span class="w3-hint">同一修复会话改方案，不进入实现。</span></div>';
      }
    }
    return out || '<p>未开始。</p>';
  }

  function implementBody(run, round, state) {
    var out = '';
    if (state === 'current') {
      out += '<div class="w3-progress"><div class="w3-progressBar"></div></div>' +
        '<p>修复会话正在实现已批准的方案（同一会话）；完成后自动送审。' +
        (round.commit ? '' : '') + '</p>';
      out += '<div class="w3-planActions">' + writeBtn('stop', 'Stop', 'dshell-btnDanger') +
        '<span class="w3-hint">' + (S.sample ? '示例：写操作已禁用' : 'Stop 后不复用旧会话；重试开新 run') + '</span></div>';
    } else if (state === 'done') {
      out += '<p>已完成并提交到新分支。</p>';
      if (round.commit) out += '<div class="w3-chips"><span class="w3-chip mono">commit ' + esc(round.commit) + '</span></div>';
      if (round.diffPath) out += '<div class="w3-chips"><span class="w3-chip mono">' + esc(round.diffPath) + '</span></div>';
    } else {
      out += '<p>未开始。</p>';
    }
    return out;
  }

  function verdictLabel(verdict) {
    if (verdict === 'approve') return '通过';
    if (verdict === 'request_changes') return '要改';
    if (verdict === 'needs_info') return '需补充信息';
    return verdict || '未出结论';
  }
  function verdictTone(verdict) {
    if (verdict === 'approve') return 'done';
    if (verdict === 'request_changes') return 'bad';
    if (verdict === 'needs_info') return 'wait';
    return 'info';
  }

  function reviewBody(run, round, state) {
    var review = round.review && typeof round.review === 'object' ? round.review : null;
    var verdict = (review && review.verdict) || round.verdict || '';
    var out = '';
    if (state === 'current') {
      return '<p>只读审核会话正在读 spec、diff 与产物；结论出来后自动推进。</p>' +
        '<div class="w3-planActions">' + writeBtn('stop', 'Stop', 'dshell-btnDanger') +
        '<span class="w3-hint">' + (S.sample ? '示例：写操作已禁用' : '审核会话 read-only，不改代码') + '</span></div>';
    }
    if (state === 'future') return '<p>未开始。</p>';
    var reviewPath = review && review.path;
    if (review) {
      if (review.summary) out += '<p>' + esc(review.summary) + '</p>';
      if (review.blocking && review.blocking.length) {
        out += '<div class="w3-section"><h3>阻塞项</h3><ul>' + review.blocking.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      }
      if (review.tests) {
        out += '<div class="w3-section"><h3>测试建议</h3>' +
          (Array.isArray(review.tests)
            ? '<ul>' + review.tests.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
            : '<p>' + esc(review.tests) + '</p>') +
          '</div>';
      }
    } else if (round.reviewText) {
      out += '<pre class="w3-prose" data-scroll-key="review-' + round.round + '">' + esc(round.reviewText) + '</pre>';
    } else {
      out += '<p>审核结论：' + esc(verdictLabel(verdict)) + '。' +
        (reviewPath ? '原文见 <code>' + esc(reviewPath) + '</code>。' : '') + '</p>';
    }
    if (reviewPath) out += '<div class="w3-chips"><span class="w3-chip mono">' + esc(reviewPath) + '</span></div>';
    return out;
  }

  function timelineHtml() {
    var run = S.run;
    if (!run) return '';
    var rounds = roundsToRender(run);
    var out = '<div class="dshell-card" data-card="timeline">' +
      '<div class="w3-cardHead"><h2>轮次时间线</h2>' +
      (S.sample ? badge('示例数据', 'wait') : '') +
      '<span class="w3-hint">第 N 轮：方案 → 实现 → 审核；批准前不动代码</span></div>' +
      '<div class="w3-timeline">';
    rounds.forEach(function (n) {
      var round = roundOf(run, n);
      var states = stageStates(run, round);
      var planTone = states.plan === 'done' ? 'done' : (states.plan === 'current' ? (run.state === 'awaiting_plan_approval' ? 'wait' : 'info') : '');
      var planLabel = states.plan === 'done' ? '已批准' : (states.plan === 'current' ? (run.state === 'fix_planning' ? '方案生成中' : (run.state === 'needs_attention' ? '需你确认' : '待你确认')) : '未开始');
      out += nodeShell(n, { key: 'plan', label: '方案' }, states.plan, badge(planLabel, planTone), planBody(run, round, states.plan));

      var implLabel = states.implement === 'done' ? '已完成' : (states.implement === 'current' ? '实现中' : '未开始');
      out += nodeShell(n, { key: 'implement', label: '实现' }, states.implement, badge(implLabel, states.implement === 'done' ? 'done' : (states.implement === 'current' ? 'info' : '')), implementBody(run, round, states.implement));

      var verdict = round.verdict || (round.review && round.review.verdict) || '';
      var reviewLabel = states.review === 'done' ? verdictLabel(verdict) : (states.review === 'current' ? '审核中' : '未开始');
      out += nodeShell(n, { key: 'review', label: '审核' }, states.review, badge(reviewLabel, states.review === 'done' ? verdictTone(verdict) : (states.review === 'current' ? 'info' : '')), reviewBody(run, round, states.review));
    });
    out += '</div></div>';
    return out;
  }

  function needsCard() {
    var run = S.run;
    var attention = run.needsAttention || {};
    var reason = attention.reason || attention.message || attention.question || run.error || '会话在等一次确认或补充信息。';
    var sessionKind = attention.from && String(attention.from).indexOf('review') === 0 ? 'review' : 'fix';
    var stageLabel = attention.from === 'fix_planning' ? '方案'
      : (attention.from === 'fix_implementing' ? '实现'
        : (attention.from && String(attention.from).indexOf('review') === 0 ? '审核' : '当前'));
    return '<div class="dshell-card" data-card="needs-attention">' +
      '<div class="w3-cardHead"><h2>需要你回复</h2>' + badge('需要你回复', 'bad') +
      '<span class="w3-hint">' + esc(run.state === 'needs_attention' ? '循环已暂停' : '') + '</span></div>' +
      '<p style="margin:0 0 7px">' + esc(reason) + '</p>' +
      '<div class="w3-notice is-warn" style="margin:0"><span>这是 DSH 原生提问/确认：窗口3 只提示并给入口，不替你回答，也不自动跳下一轮。你回答后的下一个 turn 结束会自动继续；也可以在这里手动继续。</span></div>' +
      '<div class="w3-actions">' +
        '<button class="dshell-btn" data-act="open-session" data-session="' + sessionKind + '">在 DSH 打开并回复</button>' +
        writeBtn('resume', '继续' + stageLabel + '阶段', '') +
        writeBtn('stop', 'Stop', 'dshell-btnDanger') +
        '<span class="w3-hint">回答后从当前阶段继续，不重头开始。</span>' +
      '</div></div>';
  }

  function finalCard() {
    var run = S.run;
    var last = null;
    (run.rounds || []).forEach(function (r) {
      var v = r.verdict || (r.review && r.review.verdict);
      if (v === 'approve') last = r;
    });
    var summary = last && last.review && last.review.summary ? last.review.summary : '最后一轮审核已通过。';
    var commit = (last && last.commit) || run.commits[run.commits.length - 1] || '—';
    return '<div class="dshell-card" data-card="final">' +
      '<div class="w3-cardHead"><h2>待你最终确认</h2>' + badge('待你通过', 'wait') + '</div>' +
      '<p style="margin:0 0 8px">' + esc(summary) + '</p>' +
      '<div class="w3-summary">' +
        kv('分支', run.branch || '—', true) + kv('commit', commit, true) +
        kv('轮次', '第 ' + (run.currentRound || 1) + ' 轮' + ((run.currentRound || 1) > 1 ? ' · ' + ((run.currentRound || 1) - 1) + ' 次返工' : '')) +
        kv('审核', 'approve') +
      '</div>' +
      '<div class="w3-actions">' +
        writeBtn('approve', '通过并进入复盘', '') +
        ghostBtn('toggle-feedback', '要求再改') +
        writeBtn('stop', 'Stop', 'dshell-btnDanger') +
        '<span class="w3-hint">通过后不会自动合入；先复盘，再手工 merge。</span>' +
      '</div>' +
      (S.feedbackOpen
        ? '<div class="w3-field w3-fieldWide" style="margin-top:8px"><label for="w3-feedback">要求再改的意见（进下一轮方案）</label>' +
          '<textarea class="dshell-input" id="w3-feedback" data-field="plan-feedback" rows="3">' + esc(S.feedback) + '</textarea></div>' +
          '<div class="w3-actions"><button class="dshell-btn" data-act="submit-request-changes"' + (canWrite() && String(S.feedback).trim() ? '' : ' disabled') + '>提交再改意见</button>' +
          '<span class="w3-hint">同一 run 继续，进入下一轮方案。</span></div>'
        : '') +
    '</div>';
  }

  function approvedCard() {
    var run = S.run;
    var spec = (run && run.specRef) || {};
    return '<div class="dshell-card" data-card="approved">' +
      '<div class="w3-cardHead"><h2>已通过 · 待复盘</h2>' + badge('已通过', 'done') + '</div>' +
      '<p style="margin:0 0 8px">循环结束。合入前进入复盘窗口（窗口4），读本次 spec、分支、commit、每轮 plan/diff/review。窗口3 不写复盘文件，也不会自动合入；合入由你手工完成。</p>' +
      '<div class="w3-summary">' +
        kv('分支', run.branch || '—', true) + kv('commit', (run.commits[run.commits.length - 1] || '—'), true) +
        kv('轮次', '第 ' + (run.currentRound || 1) + ' 轮') +
        kv('spec', spec.kind && spec.kind !== 'none' ? (spec.path || spec.feature || '—') : '无', true) +
      '</div>' +
      '<div class="w3-actions">' +
        '<button class="dshell-btn" data-act="retro">去复盘窗口4</button>' +
        ghostBtn('reset', '再来一条') +
        '<span class="w3-hint">合入由你手工完成；窗口3 只记录已审核/已通过。</span>' +
      '</div></div>';
  }

  function stoppedCard() {
    var run = S.run;
    return '<div class="dshell-card" data-card="stopped">' +
      '<div class="w3-cardHead"><h2>已停止</h2>' + badge('已停止', '') + '</div>' +
      '<p style="margin:0 0 8px">Stop 会取消当前会话；旧 run 保留记录。重试需要新 run / 新会话，不复用旧上下文。' +
        (run && run.error ? '原因：' + esc(run.error) : '') + '</p>' +
      '<div class="w3-actions">' + ghostBtn('reset', '新开一条') +
        '<button class="dshell-btn dshell-btnGhost" data-act="open-session" data-session="fix">打开旧会话</button></div></div>';
  }

  function failedCard() {
    var run = S.run;
    var isUnknown = run.state === 'unknown';
    return '<div class="dshell-card" data-card="failed">' +
      '<div class="w3-cardHead"><h2>' + (isUnknown ? '结果未知' : '会话失败') + '</h2>' +
      badge(isUnknown ? '结果未知' : '失败', 'bad') + '</div>' +
      '<p style="margin:0 0 8px">' + esc(run.error || (isUnknown ? '宿主中断后补写的结果；不要自动重发。' : '会话以失败结束。')) + '</p>' +
      '<div class="w3-actions">' + ghostBtn('reset', '新开一条') +
        '<button class="dshell-btn dshell-btnGhost" data-act="open-session" data-session="fix">查看会话</button>' +
        '<span class="w3-hint">不会自动重发；保留旧 run 记录。</span></div></div>';
  }

  function runStageHtml() {
    var run = S.run;
    var out = summaryHtml();
    if (run.state === 'needs_attention') out += needsCard();
    out += timelineHtml();
    if (run.state === 'awaiting_user_approval') out += finalCard();
    if (run.state === 'approved') out += approvedCard();
    if (run.state === 'stopped') out += stoppedCard();
    if (run.state === 'fix_failed' || run.state === 'review_failed' || run.state === 'unknown') out += failedCard();
    return out;
  }

  /* ---------------- 渲染：右栏 ---------------- */

  function runsHtml() {
    if (!S.runs.length) {
      return '<div class="dshell-card" data-card="runs"><div class="w3-cardHead"><h2>运行队列</h2></div>' +
        '<div class="w3-hint">还没有 run。</div></div>';
    }
    var list = sortedRuns();
    var mine = list.filter(runNeedsMe).length;
    var items = list.map(function (r) {
      var active = S.run && r.id === S.run.id ? ' on' : '';
      var info = phaseInfo(r.state);
      var repo = r.localPath ? baseNameOf(r.localPath) : '';
      return '<button class="w3-runItem' + active + '" data-act="select-run" data-run-id="' + esc(r.id || '') + '"' +
          (runNeedsMe(r) ? ' data-needs-me="1"' : '') + '>' +
        '<span class="t">' + esc(runTitleOf(r)) + '</span>' +
        '<span class="m">' + badge(info.label, info.tone) +
          '<span>第 ' + esc(r.currentRound || 1) + ' 轮</span>' +
          (repo ? '<span class="mono">' + esc(repo) + '</span>' : '') +
          (runNeedsMe(r) ? '<span class="w3-needDot" title="需要你处理">!</span>' : '') +
        '</span></button>';
    }).join('');
    return '<div class="dshell-card" data-card="runs">' +
      '<div class="w3-cardHead"><h2>运行队列</h2>' + (S.sample ? badge('示例', 'wait') : '') +
      '<span class="w3-hint">' + S.runs.length + ' 条' + (mine ? ' · ' + mine + ' 条待你处理' : '') + '</span></div>' +
      '<div class="w3-runList">' + items + '</div>' +
      '<div class="w3-actions"><button class="dshell-btn dshell-btnGhost" data-act="open-board">并行会话总览</button></div></div>';
  }

  function sessionsHtml() {
    var run = S.run;
    var uid = bugOf().uid;
    var fixId = run && run.fixSessionId;
    var reviewId = run && run.reviewSessionId;
    function row(kind, title, id, statusText, tone) {
      return '<div class="w3-session"><div class="w3-sessionHead">' +
        '<span class="w3-sessionName">' + esc(title) + '</span>' + badge(statusText, tone) + '</div>' +
        '<div class="w3-sessionId">' + esc(id || '未启动') + '</div>' +
        (id
          ? '<div class="w3-row"><button class="dshell-btn dshell-btnGhost" data-act="open-session" data-session="' + kind + '">打开</button>' +
            '<button class="dshell-btn dshell-btnGhost" data-act="copy-session" data-session="' + kind + '">复制 ID</button></div>'
          : '') +
        '</div>';
    }
    var fixStatus = '空闲';
    var reviewStatus = '未启动';
    if (run) {
      if (run.state === 'fix_implementing' || run.state === 'fix_planning') fixStatus = '运行中';
      else if (run.state === 'needs_attention') fixStatus = '等待回复';
      else if (run.state === 'fix_done' || run.state === 'review_running' || run.state === 'review_starting' || run.state === 'awaiting_plan_approval') fixStatus = '空闲';
      else if (run.state === 'stopped' || run.state === 'approved') fixStatus = '已结束';
      if (run.state === 'review_running' || run.state === 'review_starting') reviewStatus = '运行中';
      else if (run.state === 'review_done' || run.state === 'awaiting_user_approval' || run.state === 'approved') reviewStatus = '已结束';
      else if (run.state === 'needs_attention' && reviewId) reviewStatus = '等待回复';
      else if (reviewId) reviewStatus = '空闲';
    }
    return '<div class="dshell-card" data-card="sessions">' +
      '<div class="w3-cardHead"><h2>DSH 会话</h2><span class="w3-hint">原生 · 唯一真相</span></div>' +
      row('fix', 'BUG-' + (uid == null ? '?' : uid) + ' 分析修复', fixId, fixStatus, fixStatus === '运行中' ? 'info' : (fixStatus === '等待回复' ? 'bad' : '')) +
      row('review', 'BUG-' + (uid == null ? '?' : uid) + ' 审核', reviewId, reviewStatus, reviewStatus === '运行中' ? 'info' : (reviewStatus === '等待回复' ? 'bad' : (reviewStatus === '已结束' ? 'done' : ''))) +
      '<div class="w3-hint" style="margin-top:7px">审批/提问/Stop 在 DSH 里；窗口3 只做控制面。</div></div>';
  }

  function artifactUrl(name, download) {
    return API + '/artifact?runId=' + encodeURIComponent((S.run && S.run.id) || S.runId || '') +
      '&name=' + encodeURIComponent(name) + (download ? '&download=1' : '');
  }

  function artifactsHtml() {
    var run = S.run;
    var list = (run && run.artifacts) || [];
    var viewer = '';
    if (S.artifact) {
      var art = S.artifact;
      viewer = '<div class="w3-artifactViewer" data-artifact-viewer>' +
        '<div class="w3-row"><b class="mono">' + esc(art.name) + '</b>' +
        '<span class="w3-hint">' + (art.loading ? '正在读取…' : (art.error ? esc(art.error) : esc(art.size || 0) + ' 字节 · sha256 ' + esc(String(art.sha256 || '').slice(0, 12)))) + '</span>' +
        '<span class="w3-spacer"></span>' +
        '<a class="dshell-btn dshell-btnGhost" data-artifact-download href="' + esc(artifactUrl(art.name, true)) + '" download>下载</a>' +
        '<button class="dshell-btn dshell-btnGhost" data-act="close-artifact">关闭</button></div>' +
        (art.loading || art.error ? '' : '<pre class="w3-prose" data-scroll-key="artifact-' + esc(art.name) + '">' + esc(art.text || '') + '</pre>') +
        '</div>';
    }
    return '<div class="dshell-card" data-card="artifacts">' +
      '<div class="w3-cardHead"><h2>产物</h2><span class="w3-hint">' + esc(run && run.id ? 'run ' + run.id : '确认后生成') + '</span></div>' +
      (list.length
        ? list.map(function (p) {
            return '<div class="w3-artifact"><span class="n">' + esc(p) + '</span>' +
              '<span class="w3-row">' +
              '<button class="dshell-btn dshell-btnGhost" data-act="view-artifact" data-artifact="' + esc(p) + '">查看</button>' +
              '<a class="dshell-btn dshell-btnGhost" data-artifact-download href="' + esc(artifactUrl(p, true)) + '" download>下载</a>' +
              '</span></div>';
          }).join('')
        : '<div class="w3-hint">确认后生成 plan 与产物。</div>') +
      viewer +
      '</div>';
  }

  function railHtml() {
    if (!S.run && !S.draft && !S.runs.length) return '';
    // 有待确认草稿时只显示运行队列：会话/产物属于另一个 run，混在一起会误导。
    return runsHtml() + (S.run && !S.draft ? sessionsHtml() + artifactsHtml() : '');
  }

  function taskHtml() {
    var main;
    if (S.bridge === 'loading') main = loadingCard();
    else if (S.bridge === 'error') main = errorCard();
    else if (S.draft) main = confirmCard();
    else if (!S.run) main = emptyCard();
    else main = runStageHtml();
    var rail = railHtml();
    return statsHtml() +
      '<div class="w3-body"><div class="w3-main">' + main + '</div>' +
      (rail ? '<aside class="w3-rail">' + rail + '</aside>' : '') + '</div>';
  }

  /* ---------------- 渲染：并行会话板 ---------------- */

  /** 本 run 的工作区路径（旧记录没有时回退到仓库路径）。 */
  function runWorktreeOf(r) {
    if (!r) return '';
    if (r.worktree && r.worktree.path) return r.worktree.path;
    return r.localPath || '';
  }
  /** 终态 run 才允许从面板删除。 */
  var REMOVABLE_STATES = { approved: 1, stopped: 1, unknown: 1, fix_failed: 1, review_failed: 1 };
  function canRemoveRun(r) {
    return !!(r && REMOVABLE_STATES[r.state] && r.id);
  }
  /** 删除动作：两步确认，避免误点。 */
  function removeActionsHtml(r) {
    if (!canRemoveRun(r)) return '';
    if (S.confirmRemove === r.id) {
      return '<button class="dshell-btn dshell-btnDanger" data-act="remove-run" data-run-id="' + esc(r.id) + '">确认删除</button>' +
        '<button class="dshell-btn dshell-btnGhost" data-act="cancel-remove">取消</button>';
    }
    return '<button class="dshell-btn dshell-btnGhost" data-act="ask-remove" data-run-id="' + esc(r.id) + '" title="删除这条已结束的 run 记录（工作区保留）">删除</button>';
  }
  function runCardHtml(r) {
    var info = phaseInfo(r.state);
    var current = !!(S.run && r.id === S.run.id);
    var repo = r.localPath ? baseNameOf(r.localPath) : '未指定仓库';
    return '<div class="w3-runCard' + (current ? ' on' : '') + '" data-act="select-run" data-run-id="' + esc(r.id || '') + '"' +
        (runNeedsMe(r) ? ' data-needs-me="1"' : '') + '>' +
      '<div class="w3-runCardHead">' +
        '<span class="w3-runCardTitle" title="' + esc(runTitleOf(r)) + '">' + esc(runTitleOf(r)) + '</span>' +
        badge(info.label, info.tone) +
      '</div>' +
      '<div class="w3-runCardMeta">' +
        '<span class="mono" title="' + esc(r.localPath || '') + '">' + esc(repo) + '</span>' +
        (r.worktree && r.worktree.path
          ? '<span class="mono" title="' + esc(r.worktree.path) + '">工作区 ' + esc(baseNameOf(r.worktree.path)) + '</span>'
          : '') +
        '<span>第 ' + esc(r.currentRound || 1) + ' 轮</span>' +
        (r.updatedAt ? '<span>' + esc(fmtAgo(r.updatedAt)) + '</span>' : '') +
        (current ? '<span class="w3-runCardNow">当前</span>' : '') +
      '</div>' +
      '<div class="w3-runCardActs">' +
        '<button class="dshell-btn dshell-btnGhost" data-act="select-run" data-run-id="' + esc(r.id || '') + '">打开</button>' +
        (r.fixSessionId ? '<button class="dshell-btn dshell-btnGhost" data-act="open-session" data-session="fix" data-session-id="' + esc(r.fixSessionId) + '">修复会话</button>' : '') +
        (r.reviewSessionId ? '<button class="dshell-btn dshell-btnGhost" data-act="open-session" data-session="review" data-session-id="' + esc(r.reviewSessionId) + '">审核会话</button>' : '') +
        removeActionsHtml(r) +
      '</div>' +
    '</div>';
  }

  function sessionsBoardHtml() {
    var all = sortedRuns();
    var mine = all.filter(runNeedsMe);
    var running = all.filter(function (r) { return !runNeedsMe(r) && isActive(r.state); });
    var ended = all.filter(function (r) { return !runNeedsMe(r) && !isActive(r.state); });
    var head = '<div class="dshell-card" data-card="sessions-board">' +
      '<div class="w3-cardHead"><h2>并行会话</h2>' +
        badge(all.length + ' 条', '') +
        (mine.length ? badge('待你处理 ' + mine.length, 'bad') : '') +
        '<span class="w3-spacer"></span>' +
        '<button class="dshell-btn" data-act="new-manual">分析新问题</button>' +
        '<button class="dshell-btn dshell-btnGhost" data-act="refresh">刷新</button>' +
      '</div>' +
      '<div class="w3-hint">每条 run 有自己的修复 + 审核两个原生会话，互不干扰；点卡片切过去看轮次与对话。' +
        '同一仓库也能并行：桥为每条 run 另开独立工作区与分支，互不影响。</div>' +
      '</div>';
    if (!all.length) {
      return head + '<div class="dshell-card"><div class="w3-state" data-card="runs-empty"><b>还没有并行会话</b>' +
        '从窗口1 派发缺陷，或点右上「分析新问题」直接描述问题。' +
        '<div class="w3-actions"><button class="dshell-btn" data-act="new-manual">分析新问题</button></div></div></div>';
    }
    function section(title, list, hint) {
      if (!list.length) return '';
      return '<div class="w3-boardSec" data-board-sec="' + esc(title) + '">' +
        '<div class="w3-boardSecHead"><span>' + esc(title) + '</span><span class="w3-hint">' + esc(hint) + '</span></div>' +
        '<div class="w3-boardGrid">' + list.map(runCardHtml).join('') + '</div></div>';
    }
    return head +
      '<div class="w3-board" data-board>' +
        section('待你处理', mine, '点开处理：批方案 / 回复提问 / 通过') +
        section('进行中', running, 'agent 正在跑，可随时切过去看') +
        section('已结束', ended, '保留记录，可回看产物与对话') +
      '</div>';
  }

  function viewHtml() {
    if (S.view === 'chat') return chatHtml();
    if (S.view === 'sessions') return sessionsBoardHtml();
    return taskHtml();
  }

  /* ---------------- 总渲染 ---------------- */

  /** 是否正在输入或展开下拉：此时重建 DOM 会丢焦点、关掉下拉、让输入框不可用 */
  function isEditing() {
    var a = document.activeElement;
    if (!a) return false;
    var tag = String(a.tagName || '').toUpperCase();
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || a.isContentEditable === true;
  }
  function render() {
    if (!root) return;
    if (isEditing()) { S.renderPending = true; return; }
    S.renderPending = false;
    // 轮询替换DOM前保存同一run/视图的阅读位置，不串到其他运行或对话。
    var scrollScope = JSON.stringify([S.run && S.run.id, S.view, S.chatRole]);
    var sameScope = root.getAttribute('data-scroll-scope') === scrollScope;
    var positions = Object.create(null);
    if (sameScope) root.querySelectorAll('[data-scroll-key]').forEach(function (el) {
      positions[el.getAttribute('data-scroll-key')] = { top: el.scrollTop, left: el.scrollLeft };
    });
    var oldChat = sameScope && root.querySelector('[data-chat-list]');
    var chatPosition = oldChat ? {
      top: oldChat.scrollTop,
      atEnd: oldChat.scrollHeight - oldChat.clientHeight - oldChat.scrollTop <= 8
    } : null;
    root.setAttribute('data-scroll-scope', scrollScope);
    root.setAttribute('data-view', S.view);
    root.setAttribute('data-bridge', S.bridge);
    root.setAttribute('data-phase', phaseAttr());
    root.setAttribute('data-chat-role', S.chatRole);
    root.setAttribute('data-poll', S.pollMs == null ? 'none' : String(S.pollMs));
    if (S.sample) root.setAttribute('data-sample', '1');
    else root.removeAttribute('data-sample');
    root.innerHTML = headerHtml() + bannerHtml() + noticeHtml() + viewHtml();
    root.querySelectorAll('[data-scroll-key]').forEach(function (el) {
      var saved = positions[el.getAttribute('data-scroll-key')];
      if (saved) { el.scrollTop = saved.top; el.scrollLeft = saved.left; }
    });
    if (S.view === 'chat') {
      var list = root.querySelector('[data-chat-list]');
      if (list) list.scrollTop = !chatPosition || chatPosition.atEnd ? list.scrollHeight : chatPosition.top;
    }
  }

  // 输入/选择结束（失焦）后，把这段时间攒下的状态变化补渲染一次
  document.addEventListener('focusout', function () {
    if (!S.renderPending) return;
    setTimeout(function () { if (!isEditing() && S.renderPending) render(); }, 0);
  });
  /* ---------------- 交互 ---------------- */

  function patchConfirm() {
    var staleSlot = root.querySelector('[data-window-warn-slot]');
    if (staleSlot) staleSlot.innerHTML = staleWindowHtml();
    var sameRepoSlot = root.querySelector('[data-same-repo-slot]');
    if (sameRepoSlot) sameRepoSlot.innerHTML = sameRepoHintHtml();
    var wrap = root.querySelector('[data-validation]');
    if (wrap) wrap.innerHTML = checksHtml();
    var btn = root.querySelector('[data-act="confirm-dispatch"]');
    if (btn) btn.disabled = !(canWrite() && validateForm().length === 0);
    var hint = root.querySelector('[data-card="confirm"] .w3-actions .w3-hint');
    if (hint) hint.textContent = canWrite() ? '派发后进入第 1 轮方案；批准前不会产生 commit。' : '桥未安装：写操作已禁用，确认信息仍可查看/保存。';
  }
  function patchFeedback() {
    var enabled = canWrite() && String(S.feedback || '').trim();
    ['submit-plan-feedback', 'submit-request-changes'].forEach(function (act) {
      var btn = root.querySelector('[data-act="' + act + '"]');
      if (btn) btn.disabled = !enabled;
    });
  }

  function fieldChanged(node) {
    var field = node.getAttribute && node.getAttribute('data-field');
    if (!field) return;
    if (field === 'windowPreset') {
      if (!S.form) return;
      var preset = node.value;
      if (preset === 'custom') {
        // 切自定义：把当前展示值固化成可编辑的起点
        var shown = windowDisplayValues();
        S.form.from = shown.from;
        S.form.to = shown.to;
        S.form.windowMode = 'custom';
        S.form.windowPreset = 'custom';
      } else {
        S.form.windowMode = 'rolling';
        S.form.windowPreset = preset;
      }
      if (node.blur) node.blur();
      patchConfirm();
      render();
      return;
    }
    if (field === 'from' || field === 'to') {
      if (!S.form) return;
      S.form[field] = node.value;
      S.form.windowMode = 'custom';
      S.form.windowPreset = 'custom';
      patchConfirm();
      return;
    }
    if (field === 'bugTitle' || field === 'bugText') {
      if (!S.draft || !S.draft.bug) return;
      if (field === 'bugTitle') S.draft.bug.title = node.value;
      else S.draft.bug.description = node.value;
      S.draft.updatedAt = new Date().toISOString();
      scheduleDraftSave();
      patchConfirm();
      return;
    }
    if (field === 'plan-feedback') {
      S.feedback = node.value;
      patchFeedback();
      return;
    }
    if (!S.form) return;
    if (node.type === 'checkbox') S.form[field] = node.checked;
    else S.form[field] = node.value;
    if (isManualDraft()) scheduleDraftSave();
    patchConfirm();
  }

  document.addEventListener('click', function (ev) {
    var target = ev.target && ev.target.closest ? ev.target.closest('[data-act], [data-view], [data-chat-role]') : null;
    if (!target) return;

    if (target.hasAttribute('data-view')) {
      var nextView = target.getAttribute('data-view');
      S.view = (nextView === 'chat' || nextView === 'sessions') ? nextView : 'task';
      render();
      if (S.view === 'chat') {
        var page = S.messages[S.chatRole];
        if (!page.loaded && !page.loading) loadMessages(S.chatRole, true);
      }
      return;
    }
    if (target.hasAttribute('data-chat-role')) {
      switchChatRole(target.getAttribute('data-chat-role'));
      return;
    }

    var act = target.getAttribute('data-act');
    if (act === 'dismiss-notice') { S.notice = null; render(); return; }
    if (act === 'new-manual') { startManualDraft(); return; }
    if (act === 'open-board') { S.view = 'sessions'; render(); return; }
    if (act === 'ask-remove') { S.confirmRemove = target.getAttribute('data-run-id'); render(); return; }
    if (act === 'cancel-remove') { S.confirmRemove = null; render(); return; }
    if (act === 'remove-run') { removeRun(target.getAttribute('data-run-id')); return; }
    if (act === 'next-draft') { loadNextDraft(); return; }
    if (act === 'dismiss-next-draft') { S.nextDraftAvailable = false; render(); return; }
    if (act === 'refresh') { manualRefresh(); return; }
    if (act === 'retry-bridge') { boot(); return; }
    if (act === 'select-run') { selectRun(target.getAttribute('data-run-id')); return; }
    if (act === 'toggle-feedback') { S.feedbackOpen = !S.feedbackOpen; render(); return; }
    if (act === 'save-draft') { saveDraftLocal(); return; }
    if (act === 'discard-draft') { discardDraft(); return; }
    if (act === 'confirm-dispatch') { dispatchDraft(); return; }
    if (act === 'approve-plan') { approvePlan(); return; }
    if (act === 'submit-plan-feedback') { submitPlanFeedback(); return; }
    if (act === 'submit-request-changes') { submitRequestChanges(); return; }
    if (act === 'resume') { resumeRun(); return; }
    if (act === 'view-artifact') { viewArtifact(target.getAttribute('data-artifact')); return; }
    if (act === 'close-artifact') { S.artifact = null; render(); return; }
    if (act === 'stop') { stopRun(); return; }
    if (act === 'approve') { approveRun(); return; }
    if (act === 'load-more') {
      var role = S.chatRole;
      if (S.messages[role].more) loadMessages(role, false);
      return;
    }
    if (act === 'open-session') { openSession(target.getAttribute('data-session') || 'fix', target.getAttribute('data-session-id') || undefined); return; }
    if (act === 'copy-session') {
      var kind = target.getAttribute('data-session') || 'fix';
      var id = S.run && (kind === 'review' ? S.run.reviewSessionId : S.run.fixSessionId);
      if (id) copyText(id, '已复制会话 ID：' + id);
      else toast('这个会话还没启动');
      return;
    }
    if (act === 'retro') {
      toast('复盘窗口（窗口4）还没挂载；run ' + ((S.run && S.run.id) || '?') + ' 已记录，可在复盘页打开。');
      return;
    }
    if (act === 'reset') {
      clearDraft();
      S.draft = null;
      S.form = null;
      S.run = null;
      S.runId = null;
      S.runError = '';
      S.view = 'task';
      S.messages = { fix: blankPage(), review: blankPage() };
      S.artifact = null;
      S.feedbackOpen = false;
      S.feedback = '';
      S.notice = { kind: 'info', text: '已清空当前视图；窗口1 再派发会开新 run / 新会话。旧 run 仍可在运行队列里打开。' };
      if (S.bridge === 'ok') {
        refreshRuns({ silent: true }).then(function () { schedulePoll(); render(); });
      }
      schedulePoll();
      render();
      return;
    }
  });

  document.addEventListener('input', function (ev) {
    fieldChanged(ev.target);
  });
  document.addEventListener('change', function (ev) {
    var node = ev.target;
    if (!node || !node.getAttribute) return;
    var field = node.getAttribute('data-field');
    if (field === 'connectionId') {
      if (!S.form) return;
      S.form[field] = node.value;
      patchConfirm();
      return;
    }
    fieldChanged(node);
  });

  async function manualRefresh() {
    if (S.bridge !== 'ok') { boot(); return; }
    S.notice = null;
    await refreshRuns({ silent: true });
    await refreshRun({ silent: true });
    if (S.view === 'chat') await loadMessages(S.chatRole, true);
    render();
    toast('已刷新');
  }

  function selectRun(id) {
    if (!id || S.bridge !== 'ok') return;
    S.draft = null;
    S.form = null;
    S.confirmRemove = null;
    S.runId = id;
    S.run = null;
    S.runError = '';
    S.view = 'task';
    S.chatRole = 'fix';
    S.messages = { fix: blankPage(), review: blankPage() };
    S.artifact = null;
    S.feedbackOpen = false;
    S.feedback = '';
    S.notice = null;
    refreshRun().then(function () { schedulePoll(); render(); });
  }

  boot();
})();
</script>
</body>
</html>
