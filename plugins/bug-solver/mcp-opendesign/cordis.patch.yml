- insert:
    - id: opendesign-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: opendesign
        transport: stdio
        # OpenDesign 0.26.1, stable channel, installed outside the repo.
        command: 'D:\programming\Open Design\Open Design.exe'
        args:
          - 'D:\programming\Open Design\resources\app\prebundled\daemon\daemon-cli.mjs'
          - mcp
        env:
          ELECTRON_RUN_AS_NODE: '1'
          OD_DATA_DIR: 'D:\programming\openDesignData'
          # Managed discovery: accept both the app's own pipes and the headless
          # instance this MCP may bootstrap. Names are derived, not random:
          #   sha256("<username>\nchannel=..\nnamespace=..\nsource=..\nmode=..\napp=..")[0:32]
          # with username=pc-zzy, channel=stable, namespace=release-stable-win,
          # source=packaged. Recompute if the OpenDesign user/channel changes.
          OD_MCP_DISCOVERY: '{"daemon":["\\\\.\\pipe\\open-design-sidecar-d04833fe5d36bf8226bcf2201ca36e97","\\\\.\\pipe\\open-design-sidecar-384aa4a05b0c6e92b329f3a092f220af"],"desktop":["\\\\.\\pipe\\open-design-sidecar-0da43bf1b82bcfde0fb84bce5dae821d","\\\\.\\pipe\\open-design-sidecar-c64b2b11a33e4cff5686447678369d3d"]}'
          OD_MCP_BOOTSTRAP_COMMAND: 'D:\programming\Open Design\Open Design.exe'
          OD_MCP_BOOTSTRAP_ARGS: '["--headless","--od-mcp-managed"]'
        toolCallTimeoutMs: 120000
        failOnStartupError: false
