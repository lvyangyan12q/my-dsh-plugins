<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知间 · 学习空间样式原型</title>
<!-- THROWAWAY UI PROTOTYPE: three structurally distinct personal learning layouts on one route, ?variant=A/B/C. No persistence or live AI. Style reference: nexu-io/open-design apps/web/src/styles/tokens.css. -->
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#202020;background:#fff;font-size:14px;--line:#ededed;--green:#87ea5c;--soft:#f2fff2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit;background:white;border:1px solid #dbdbdb;border-radius:9px;padding:10px 15px}button:hover{background:#f2f2f2}button:focus-visible{outline:2px solid #007106;outline-offset:3px}button.active{background:var(--soft);border-color:#aad99b;color:#0d5400}.primary{background:#202020;color:white;border-color:#202020}.primary:hover{background:#414141}p{line-height:1.8;color:#666}h1{font-size:34px;letter-spacing:-1.2px;font-weight:550;margin:12px 0}h2{font-size:20px;font-weight:550}small,.muted{color:#848484}.eyebrow{font-size:11px;letter-spacing:2px;color:#777;text-transform:uppercase}.brand{font-size:20px;font-weight:650;display:flex;align-items:center;gap:10px}.mark{background:var(--green);color:#202020;border-radius:10px;width:32px;height:32px;display:grid;place-items:center}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 28px;gap:16px}.crumb{font-size:12px;color:#777}.tag{display:inline-block;background:var(--soft);color:#007106;padding:5px 9px;border-radius:6px;font-size:11px}.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:#fafafa;border-right:1px solid var(--line);padding:28px 16px}.navlabel{font-size:11px;color:#999;margin:25px 12px 12px}.sidebar button{display:block;width:100%;text-align:left;border:0;background:none;margin:5px 0}.sidebar button.active{background:#ebebeb;color:#202020}.progress{height:4px;background:#e8e8e8;border-radius:5px;margin:14px 0}.progress i{display:block;background:#87ea5c;height:100%;width:40%}.workspace{padding:30px 34px 110px;max-width:1600px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.panel{border:1px solid var(--line);border-radius:16px;background:white;overflow:hidden}.panelhead{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:24px}.experiment{background:#fafafa;padding:25px;border-radius:12px}.experiment h2{margin:0 0 6px}.formula{font:24px Georgia,serif;color:#202020;margin:22px 0}.plot{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-width:470px;margin:24px auto}.dot{aspect-ratio:1;border-radius:5px;background:#dfdfdf;transition:background .3s,opacity .3s,transform .3s}.dot.b{background:#87ea5c}.dot.both{background:#202020}.condition .dot:not(.b):not(.both){opacity:.12;transform:scale(.65)}.legend{display:flex;gap:16px;font-size:11px;color:#666;flex-wrap:wrap}.key:before{content:'';display:inline-block;width:8px;height:8px;background:var(--c);border-radius:2px;margin-right:6px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0 0}input[type=range]{accent-color:#202020;flex:1;min-width:100px}.result{font-size:13px;padding:14px 0;color:#444;min-height:46px}.steps{display:flex;gap:8px;margin:18px 0}.steps span{flex:1;height:3px;background:#eee}.steps span:first-child{background:#202020}.chat{font-size:13px}.avatar{width:26px;height:26px;border-radius:50%;background:#202020;color:#87ea5c;display:inline-grid;place-items:center;margin-right:8px}.bubble{padding:15px;background:#f7f7f7;border-radius:12px;line-height:1.8;margin:18px 0}.chat button{font-size:12px;margin:3px 0;text-align:left;width:100%}.note{font-size:11px;color:#888;margin-top:18px}.composer{display:flex;gap:8px;padding:10px;border:1px solid #dbdbdb;border-radius:12px;margin-top:20px}.composer input{border:0;outline:0;min-width:0;width:100%;background:none}.composer button{width:auto;background:#202020;color:#87ea5c;margin:0}.bottom{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(32,32,32,.95);color:white;border-radius:50px;padding:7px;display:flex;gap:5px;align-items:center;box-shadow:0 8px 35px #0002;z-index:20;white-space:nowrap}.bottom button{border:0;background:transparent;color:#bbb;padding:9px 14px;border-radius:30px;font-size:12px}.bottom button.selected{background:white;color:#202020}.bottom small{color:#aaa;margin:0 10px;font-size:10px}.state{font-size:11px;color:#888;padding:12px 0;line-height:1.6}.maplayout{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:calc(100vh - 68px)}.maparea{padding:35px 40px 110px;background-image:radial-gradient(#ddd 1px,transparent 1px);background-size:20px 20px}.maparea h1{background:white;display:inline-block}.graph{position:relative;width:100%;max-width:850px;height:420px;margin:30px auto}.edges{position:absolute;width:100%;height:100%;inset:0}.edges path{fill:none;stroke:#c7c7c7;stroke-width:1.5}.node{position:absolute;width:155px;padding:17px;text-align:left;box-shadow:0 4px 15px #00004}.node small{display:block;margin-top:9px;font-size:10px}.node.current{background:#202020;color:white;border-color:#202020}.node.current small{color:#87ea5c}.inspector{padding:30px 24px 100px;border-left:1px solid var(--line)}.focus{max-width:1100px;margin:0 auto;padding:50px 30px 110px}.focushead{max-width:690px;margin:auto;text-align:center}.focushead h1{font-size:45px;line-height:1.4}.focusgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;margin-top:32px;align-items:start}.question{padding-top:20px}.question button{display:block;width:100%;margin:12px 0;text-align:left}.lessonnav{display:flex;justify-content:center;gap:28px;font-size:12px;margin-top:24px;color:#999}.lessonnav b{color:#202020}.toast{position:fixed;top:80px;right:20px;background:#202020;color:white;padding:14px 20px;border-radius:12px;z-index:50;max-width:350px}.hidden{display:none}@media(max-width:1050px){.columns{grid-template-columns:1fr}.shell{grid-template-columns:170px 1fr}.maplayout{grid-template-columns:1fr}.inspector{border-top:1px solid var(--line)}.focusgrid{gap:24px}.workspace{padding:25px 20px 110px}}@media(max-width:650px){.sidebar{display:none}.shell{display:block}.top{padding:0 16px}.crumb{display:none}h1{font-size:27px}.focushead h1{font-size:32px}.focusgrid{grid-template-columns:1fr}.maparea{padding:25px 12px}.node{width:112px;padding:11px;font-size:11px}.bottom small{display:none}.bottom button{padding:9px 10px}.heading{align-items:start}.content{padding:16px}.focus{padding:30px 18px 100px}}
</style><div id="app"></div><nav class="bottom" aria-label="原型布局切换"><button onclick="cycle(-1)" aria-label="上一方案">←</button><small>样式原型</small><button data-v="A" onclick="switchTo('A')">A 工作室</button><button data-v="B" onclick="switchTo('B')">B 知识地图</button><button data-v="C" onclick="switchTo('C')">C 沉浸课堂</button><button onclick="cycle(1)" aria-label="下一方案">→</button></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';let count=20,condition=false,answer='',selected='条件概率';const titles=['随机事件','联合概率','条件概率','独立性','贝叶斯定理'];
function pageHeader(){return `<header class="top"><div class="brand"><span class="mark">∴</span>知间 <small style="font-size:11px;font-weight:400;margin-left:8px">个人学习空间</small></div><span class="crumb">概率与不确定性 / 03 条件概率</span><span class="tag">交互样课 · 示例数据</span></header>`}
function state(){return `<div class="state">方案 ${variant} · 当前节点：${selected} · A∩B=${count} / B=40 · ${condition?'仅观察 B':'观察全集'} · ${answer||'尚未作答'} · 数据仅保留在本次页面</div>`}
function experiment(){return `<section class="experiment"><div class="eyebrow">INTERACTIVE LAB / 01</div><h2 style="margin-top:12px">已知 B 发生，世界变小了</h2><p style="font-size:12px;margin:6px 0">100 个样本中，40 个属于 B。黑色表示同时属于 A 和 B。</p><div class="plot ${condition?'condition':''}">${Array.from({length:100},(_,i)=>`<i class="dot ${i<count?'both':i<40?'b':''}"></i>`).join('')}</div><div class="legend"><span class="key" style="--c:#202020">A ∩ B</span><span class="key" style="--c:#87ea5c">B 中的其他样本</span><span class="key" style="--c:#dfdfdf">B 之外</span></div><div class="controls"><label for="overlap">交集数量</label><input id="overlap" type="range" min="0" max="40" value="${count}" oninput="count=+this.value;updateLab()"><output id="amount">${count}</output></div><div class="controls"><button class="${condition?'primary':''}" onclick="condition=!condition;render()">${condition?'↗ 返回全部样本':'◎ 只看 B 中的样本'}</button><button onclick="count=20;condition=false;render()">重置</button></div><div class="formula" id="formula">${formula()}</div><div class="result">${condition?'分母是 B 中的 40 个样本。条件改变了我们观察的范围。':'分母是全部 100 个样本。点击「只看 B」比较两种概率。'}</div></section>`}
function formula(){return condition?`P(A | B) = ${count} / 40 = ${(count/40*100).toFixed(0)}%`:`P(A ∩ B) = ${count} / 100 = ${count}%`}
function updateLab(){document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot '+(i<count?'both':i<40?'b':''));document.querySelector('#amount').textContent=count;document.querySelector('#formula').textContent=formula();document.querySelectorAll('.state').forEach(x=>x.outerHTML=state())}
function chat(){return `<div class="chat"><div><span class="avatar">✳</span><b>学习导师</b> <small>/teach</small></div><div class="bubble">先不用记公式。<br>如果只保留绿色区域，你计算比例时，还应该除以 100 吗？<br><br>试着切换观察范围，看看分母发生了什么。</div><button onclick="hint('直观理解')">↗ 换一个直观的解释</button><button onclick="hint('先修知识')">↗ 补一下先修知识</button><div id="reply" class="bubble hidden"></div><form class="composer" onsubmit="event.preventDefault();hint('自由追问')"><input aria-label="向导师追问" placeholder="哪里还没想明白？"><button aria-label="发送追问">↑</button></form><div class="note">导师回复为预置演示，尚未连接 AI。</div></div>`}
function quiz(){return `<div class="question"><span class="eyebrow">CHECK YOUR UNDERSTANDING</span><h2>先想一想，再选答案。</h2><p>已知样本属于 B，计算 P(A | B) 时，分母应该是多少？</p><button onclick="choose(false)">100 · 全部样本</button><button onclick="choose(true)">40 · 属于 B 的样本</button><p id="feedback" role="status">${answer||'试着用自己的话解释：条件到底改变了什么？'}</p></div>`}
function VariantA(){return `${pageHeader()}<div class="shell"><aside class="sidebar"><div class="navlabel">我的学习</div><button class="active" onclick="switchTo('A')">▤ 学习工作室</button><button onclick="switchTo('B')">⌘ 知识地图</button><div class="navlabel">概率与不确定性</div>${titles.map((t,i)=>`<button onclick="selectNode('${t}')" class="${t===selected?'active':''}">${i<2?'✓':'0'+(i+1)}　${t}</button>`).join('')}<div style="margin:30px 12px"><small>课程示例进度</small><div class="progress"><i></i></div><small>2 / 5 个概念已学习</small></div></aside><main class="workspace"><div class="heading"><div><div class="eyebrow">YOUR NEXT SMALL DISCOVERY</div><h1>从「发生了什么」到「已知什么」</h1><p style="margin:0">条件概率 · 一个实验，理解观察范围的变化</p></div><button onclick="switchTo('C')">专注学习 ↗</button></div><div class="columns"><article class="panel"><div class="panelhead"><b>03 / 条件概率</b><small>实验 → 理解 → 练习</small></div><div class="content">${experiment()}${quiz()}</div></article><aside class="panel"><div class="panelhead">随堂对话<span class="tag">与当前课程关联</span></div><div class="content">${chat()}</div></aside></div>${state()}</main></div>`}
function VariantB(){return `${pageHeader()}<div class="maplayout"><main class="maparea"><div class="eyebrow">CONNECT THE DOTS</div><h1>理解，正在连成一张图。</h1><p>从已知出发。选择一个概念，看它连接到哪里。</p><div class="graph"><svg class="edges" viewBox="0 0 800 420" preserveAspectRatio="none"><path d="M140 180 C230 180 230 85 330 85 M140 180 C230 180 230 290 330 290 M400 85 C510 85 510 180 600 180 M400 290 C510 290 510 180 600 180 M620 210 L620 335"/></svg>${titles.map((t,i)=>{let pos=[[3,36],[34,10],[34,65],[72,36],[72,77]][i];return `<button class="node ${t===selected?'current':''}" style="left:${pos[0]}%;top:${pos[1]}%" onclick="selectNode('${t}')">${t===selected?'◉':'○'}　${t}<small>${i<2?'✓ 示例：已学习':i===2?'推荐下一步 · 约 8 分钟':'待探索'}</small></button>`}).join('')}</div><div class="legend"><span>实线：建议学习顺序（示例）</span><span>点击节点查看学习入口</span></div>${state()}</main><aside class="inspector"><span class="tag">概念档案</span><h1>${selected}</h1><p>${selected==='条件概率'?'当你获得新信息，应该如何重新计算概率？理解它，就能进一步理解独立性和贝叶斯定理。':'把这个概念放回完整的学习路径，看看它与条件概率之间的联系。'}</p><hr style="border:0;border-top:1px solid #eee;margin:28px 0"><small>先修概念</small><p>随机事件　→　联合概率</p><small>这节课你将学会</small><p>① 缩小观察范围<br>② 区分联合概率与条件概率<br>③ 用样本数量解释公式</p><button class="primary" style="width:100%" onclick="selected='条件概率';switchTo('C')">进入条件概率样课 →</button><p class="note">当前只有条件概率包含可操作样课；其他节点展示导航关系。</p>${chat()}</aside></div>`}
function VariantC(){return `${pageHeader()}<main class="focus"><div class="focushead"><span class="eyebrow">LESSON 03 / A CHANGE OF PERSPECTIVE</span><h1>新信息，<br>如何改变你的判断？</h1><p>今天只理解一件事：条件概率，是在一个更小的世界里重新计数。</p><div class="lessonnav"><span>01 建立直觉</span><b>02 动手探索</b><span>03 检验理解</span></div></div><div class="focusgrid"><div>${experiment()}</div><aside>${quiz()}<div class="steps"><span></span><span></span><span></span></div>${chat()}</aside></div>${state()}</main>`}
function render(){document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])();document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('selected',x.dataset.v===variant))}function switchTo(v){variant=v;let u=new URL(location);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}function cycle(n){switchTo(['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3])}function selectNode(t){selected=t;render()}function choose(ok){answer=ok?'回答正确：已知 B 发生，分母只包含 B 中的 40 个样本。':'再想想：100 包含了已知不可能发生的 B 之外的样本。试试「只看 B」。';document.getElementById('feedback').textContent=answer;document.querySelectorAll('.state').forEach(x=>x.outerHTML=state())}function hint(kind){const el=document.getElementById('reply');el.classList.remove('hidden');el.textContent=kind==='先修知识'?'先修提示：联合概率计算 A 与 B 同时发生的比例；条件概率只在 B 已发生的范围内计算。':kind==='自由追问'?'演示回复：把 B 当作筛选器。筛选后剩下 40 个样本，再数其中有多少个同时属于 A。正式版会结合你的问题回答。':'想象从 100 人中，只选出会游泳的 40 人。问这 40 人里有多少人会骑车，分母自然是 40。'}document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});render();
</script></html>
